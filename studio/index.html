<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aliving2D Studio</title>
<style>
  /* Studio: dark chrome so the character art is what you see; one violet accent for what you can act on */
  :root {
    --app: #0f1014; --rail: #0b0c0f; --panel: #16171c; --raise: #1d1f26; --hover: #252731; --line: #282a33;
    --ink: #ececf1; --soft: #b4b6c4; --quiet: #868899; --faint: #5d6070;
    --accent: #9b8cff; --accent-ink: #120f24; --accent-soft: #9b8cff22;
    --ok: #3ecf8e; --run: #9b8cff; --warn: #f2b84b; --bad: #ff6b6b;
    --stage: #1a1b21;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 13.5px/1.5 "Pretendard", system-ui, "Malgun Gothic", sans-serif; background: var(--app); color: var(--ink);
         display: grid; grid-template-columns: 84px minmax(0, 1fr) 340px; grid-template-rows: minmax(0, 1fr); overflow: hidden; }
  body.nojob { grid-template-columns: 84px minmax(0, 1fr); }
  body.nojob .insp, body.wide .insp { display: none; }
  body.wide { grid-template-columns: 84px minmax(0, 1fr); }
  .btn.on { border-color: var(--accent); color: var(--accent); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #2c2e38; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- left rail: new + jobs + status ---------- */
  .rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; min-height: 0; }
  .logo { font-weight: 800; letter-spacing: -.4px; font-size: 13px; padding: 16px 0 12px; white-space: nowrap; }
  .logo b { color: var(--accent); }
  .new { width: 52px; height: 52px; flex: none; border-radius: 14px; border: 1.5px dashed #3a3d4a; color: var(--soft); font-size: 24px; line-height: 1; display: grid; place-items: center; transition: .15s; }
  .new:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .jobs { flex: 1; overflow: auto; width: 100%; padding: 14px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .jb { width: 66px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--quiet); font-size: 11px; position: relative; padding: 0; }
  .jb .th { width: 52px; height: 52px; border-radius: 14px; overflow: hidden; background: var(--raise); outline: 2px solid transparent; outline-offset: 2px; transition: outline-color .15s; }
  .jb .th img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .jb:hover .th { outline-color: #3a3d4a; } .jb.sel .th { outline-color: var(--accent); } .jb.sel { color: var(--ink); }
  .jb .nm { max-width: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jb .sd { position: absolute; top: -3px; right: 3px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--rail); display: none; }
  .sd.running, .sd.starting { display: block; background: var(--run); animation: pulse 1.2s infinite; } .sd.error { display: block; background: var(--bad); }
  @keyframes pulse { 50% { opacity: .35; } }
  .status { padding: 10px 0 14px; display: flex; flex-direction: column; gap: 8px; align-items: center; border-top: 1px solid var(--line); width: 100%; }
  .stt { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--quiet); cursor: default; }
  .stt i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .stt.ok i { background: var(--ok); } .stt.warn i { background: var(--warn); } .stt.bad i { background: var(--bad); }

  /* ---------- top bar ---------- */
  main { display: grid; grid-template-rows: 56px minmax(0, 1fr); min-width: 0; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
  .title { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 0; }
  .title h1 { font-size: 16px; margin: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; padding: 2px 6px; border-radius: 6px; cursor: text; }
  .title h1:hover { background: var(--hover); }
  .title h1[contenteditable=true] { outline: 1.5px solid var(--accent); background: var(--raise); }
  .chip { font-size: 11.5px; padding: 2px 9px; border-radius: 99px; background: var(--raise); color: var(--soft); white-space: nowrap; }
  .chip.ok { background: #3ecf8e1f; color: var(--ok); } .chip.run { background: var(--accent-soft); color: var(--accent); } .chip.bad { background: #ff6b6b1f; color: var(--bad); }
  .meta { color: var(--quiet); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: flex; background: var(--app); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; flex: none; }
  .seg button { padding: 5px 16px; border-radius: 6px; color: var(--quiet); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .seg button:hover { color: var(--ink); } .seg button.on { background: var(--raise); color: var(--ink); box-shadow: 0 1px 0 #ffffff10 inset; }
  .seg button small { font-weight: 400; color: var(--faint); margin-left: 5px; }
  .acts { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex: 1 1 0; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; text-decoration: none; white-space: nowrap;
         background: var(--raise); color: var(--ink); border: 1px solid var(--line); }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--bad); }

  /* ---------- stage ---------- */
  .stage { position: relative; min-height: 0; min-width: 0; overflow: hidden; background: var(--stage); }
  .stage > .view { position: absolute; inset: 0; display: none; }
  .stage > .view.on { display: block; }
  .art { position: absolute; inset: 14px; border-radius: 12px; overflow: hidden; background: #f3f1f6; box-shadow: 0 0 0 1px #ffffff0d, 0 20px 50px #0006; }
  .art iframe { width: 100%; height: 100%; border: 0; display: block; }
  .center { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; overflow: auto; }

  /* empty / upload */
  .hero { max-width: 540px; }
  .hero h2 { font-size: 26px; margin: 0 0 8px; letter-spacing: -.5px; }
  .hero p { color: var(--soft); margin: 0 0 22px; }
  .drop { display: block; border: 2px dashed #3a3d4a; border-radius: 16px; padding: 38px 20px; cursor: pointer; transition: .15s; color: var(--soft); }
  .drop:hover { border-color: var(--accent); background: var(--accent-soft); }
  .drop b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
  .flow { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 22px; color: var(--quiet); font-size: 12px; }
  .flow span { background: var(--panel); border: 1px solid var(--line); padding: 3px 10px; border-radius: 99px; }
  .dropover { position: fixed; inset: 0; background: #0f1014d9; z-index: 40; display: none; place-items: center; font-size: 20px; font-weight: 700; color: var(--accent); pointer-events: none; }
  .dropover.on { display: grid; } .dropover div { border: 2.5px dashed var(--accent); border-radius: 20px; padding: 60px 90px; }

  /* making the model (before the rig) */
  .making { width: min(560px, 100%); }
  .making .pv { width: 220px; height: 220px; margin: 0 auto 18px; border-radius: 16px; overflow: hidden; background: var(--panel); position: relative; }
  .making .pv img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .making .pv::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 55%, var(--stage)); }
  .making h2 { font-size: 20px; margin: 0 0 4px; } .making .sub { color: var(--soft); }
  .big { height: 8px; background: var(--raise); border-radius: 8px; overflow: hidden; margin: 18px 0 8px; }
  .big i { display: block; height: 100%; background: linear-gradient(90deg, #7c6cf0, var(--accent)); transition: width .5s; border-radius: 8px; }
  .making .err { color: var(--bad); margin-top: 12px; white-space: pre-wrap; font-size: 12.5px; text-align: left; background: #ff6b6b14; padding: 10px 12px; border-radius: 8px; max-height: 160px; overflow: auto; }

  /* parts: the stacked layers */
  .space3 { position: absolute; inset: 0; perspective: 2400px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #262833, var(--stage) 70%); }
  .space { position: absolute; left: 50%; top: 46%; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.2,.8,.2,1); }
  .space img { position: absolute; cursor: zoom-in; transition: transform .8s cubic-bezier(.2,.8,.2,1), opacity .25s, filter .25s; }
  .space img.dim { opacity: .06; } .space img.hl { filter: drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 3px var(--accent)); }
  .space .plate { position: absolute; border: 1px solid #ffffff1a; background: #ffffff08; transition: transform .8s cubic-bezier(.2,.8,.2,1), opacity .5s; }
  .floatbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 16px; display: flex; gap: 10px; align-items: center; background: #16171ce6; backdrop-filter: blur(8px);
              border: 1px solid var(--line); border-radius: 12px; padding: 6px; z-index: 2; max-width: calc(100% - 24px); overflow-x: auto; }
  .floatbar:empty { display: none; }
  .floatbar label { display: flex; gap: 8px; align-items: center; color: var(--quiet); font-size: 12px; padding: 0 8px; white-space: nowrap; }
  input[type=range] { accent-color: var(--accent); width: 120px; }
  .cards { position: absolute; inset: 0; overflow: auto; padding: 18px 18px 84px; }
  .cards .gh { color: var(--soft); font-weight: 600; margin: 6px 2px 8px; font-size: 12.5px; }
  .cards .gr { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: zoom-in; transition: border-color .15s; }
  .card:hover, .card.hl { border-color: var(--accent); }
  .card .im { height: 120px; display: grid; place-items: center; padding: 8px; background: repeating-conic-gradient(#20222a 0% 25%, #1a1b21 0% 50%) 50% / 14px 14px; }
  .card .im img { max-width: 100%; max-height: 104px; object-fit: contain; }
  .card .nm { padding: 6px 9px 0; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .k { padding: 0 9px 7px; font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty-note { position: absolute; inset: 0; display: grid; place-items: center; color: var(--quiet); }

  /* pictures */
  .pic { position: absolute; inset: 18px; }
  .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; filter: drop-shadow(0 16px 40px #0007); }

  /* ---------- inspector ---------- */
  .insp { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .insp > header { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .insp > header h2 { font-size: 14px; margin: 0; }
  .insp > header p { margin: 4px 0 0; color: var(--quiet); font-size: 12px; }
  .insp .body { flex: 1; overflow: auto; min-height: 0; padding: 4px 0 16px; }
  .sec { padding: 12px 18px; }
  .sec + .sec { border-top: 1px solid var(--line); }
  .sec h3 { font-size: 11px; letter-spacing: .6px; color: var(--faint); margin: 2px 0 10px; font-weight: 700; }
  .sec .hint { color: var(--quiet); font-size: 12px; margin-top: 8px; }

  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; padding: 6px 0; align-items: start; position: relative; }
  .steps li::before { content: ""; position: absolute; left: 8px; top: 24px; bottom: -6px; width: 2px; background: var(--line); }
  .steps li:last-child::before { display: none; }
  .steps .d { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); margin-top: 1px; position: relative; z-index: 1;
              display: grid; place-items: center; font-size: 10px; color: var(--accent-ink); line-height: 1; }
  .steps .d.done { background: var(--ok); border-color: var(--ok); } .steps .d.done::after { content: "✓"; font-weight: 800; }
  .steps .d.running { border-color: var(--accent); background: var(--accent-soft); animation: pulse 1.2s infinite; }
  .steps .d.error { background: var(--bad); border-color: var(--bad); } .steps .d.error::after { content: "!"; font-weight: 800; }
  .steps .d.skipped { border-style: dashed; } .steps .d.skipped::after { content: "–"; color: var(--quiet); }
  .seg { display: inline-flex; margin-top: 5px; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { font-size: 11.5px; padding: 2px 9px; color: var(--quiet); } .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; } .seg button:disabled { opacity: .5; }
  .steps .n { font-weight: 600; font-size: 13px; } .steps .m { font-size: 11.5px; color: var(--quiet); }
  .steps .e { font-size: 11.5px; color: var(--bad); white-space: pre-wrap; word-break: break-word; max-height: 90px; overflow: auto; }
  .steps .pb { height: 4px; background: var(--raise); border-radius: 4px; margin-top: 4px; overflow: hidden; } .steps .pb i { display: block; height: 100%; background: var(--accent); }
  .redo { color: var(--faint); font-size: 12px; padding: 2px 8px; border-radius: 6px; opacity: 0; transition: .15s; white-space: nowrap; }
  .steps li:hover .redo, .redo:focus { opacity: 1; } .redo:hover { color: var(--accent); background: var(--accent-soft); }

  .tg { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; gap: 10px; cursor: pointer; }
  .tg span small { display: block; color: var(--faint); font-size: 11.5px; }
  .sw { appearance: none; width: 34px; height: 20px; border-radius: 20px; background: var(--hover); position: relative; cursor: pointer; flex: none; transition: .15s; margin: 0; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--soft); transition: .15s; }
  .sw:checked { background: var(--accent); } .sw:checked::after { left: 17px; background: #fff; }
  .sw:disabled { opacity: .4; cursor: default; }

  .rows { list-style: none; margin: 0; padding: 0 10px; }
  .rows .gh { font-size: 11px; letter-spacing: .5px; color: var(--faint); font-weight: 700; padding: 12px 8px 4px; display: flex; justify-content: space-between; gap: 8px; }
  .rw { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 5px 8px; border-radius: 8px; cursor: zoom-in; }
  .rw:hover, .rw.hl { background: var(--hover); } .rw.sel { background: var(--accent-soft); }
  .rw .ti { width: 40px; height: 40px; border-radius: 7px; display: grid; place-items: center; overflow: hidden; background: repeating-conic-gradient(#25272f 0% 25%, #1e2026 0% 50%) 50% / 10px 10px; }
  .rw .ti img { max-width: 36px; max-height: 36px; object-fit: contain; }
  .rw .nm { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rw .k { font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rw.off .ti, .rw.off .nm { opacity: .35; }
  .eye { width: 28px; height: 28px; border-radius: 7px; color: var(--quiet); display: grid; place-items: center; }
  .eye:hover { background: var(--raise); color: var(--ink); }
  .eye svg { width: 16px; height: 16px; }

  .keybox { margin: 12px 14px 0; padding: 12px; border-radius: 10px; background: #f2b84b14; border: 1px solid #f2b84b40; color: var(--soft); font-size: 12px; }
  .keybox input { width: 100%; margin-top: 8px; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--app); }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--bad); color: #fff; padding: 9px 16px; border-radius: 9px; z-index: 60; display: none; font-weight: 600; }
  .toast.on { display: block; }

  /* one part / picture, large */
  .lb { position: fixed; inset: 0; background: #08090cf2; display: none; z-index: 50; }
  .lb.on { display: block; }
  .lb .view { position: absolute; inset: 60px 18px 18px; overflow: hidden; border-radius: 12px; cursor: grab; background: repeating-conic-gradient(#22242c 0% 25%, #1b1c22 0% 50%) 50% / 22px 22px; }
  .lb .view.drag { cursor: grabbing; }
  .lb .view img { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; }
  .lb .lbar { position: absolute; left: 18px; right: 18px; top: 12px; display: flex; gap: 8px; align-items: center; }
  .lb .lbar b { font-size: 15px; white-space: nowrap; } .lb .lbar .m { color: var(--quiet); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb .lbar .btn { padding: 5px 11px; } .lb .zv { color: var(--soft); min-width: 48px; text-align: center; font-size: 12px; }

  @media (max-width: 1100px) { body { grid-template-columns: 84px minmax(0, 1fr) 290px; } .meta { display: none; } }
</style>
</head>
<body class="nojob">
<nav class="rail">
  <div class="logo">Aliving<b>2D</b></div>
  <button class="new" id="newBtn" title="새 그림 올리기 (창 아무 데나 끌어 놓아도 됩니다)">+</button>
  <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
  <div class="jobs" id="jobs"></div>
  <div class="status">
    <div class="stt" id="stSee"><i></i>분리</div>
    <div class="stt" id="stKey"><i></i>GPT</div>
  </div>
</nav>
<main>
  <div class="bar" id="bar"></div>
  <section class="stage" id="stage">
    <div class="view" data-v="empty"><div class="center"><div class="hero">
      <h2>그림 한 장으로 움직이는 모델</h2>
      <p>캐릭터 그림을 올리면 Live2D 장인의 순서대로 파츠를 나누고 리깅합니다.</p>
      <label class="drop" for="file"><b>그림 올리기</b>여기를 누르거나 창 아무 데나 끌어 놓으세요 · PNG · JPG · WEBP</label>
      <div class="flow"><span>다듬기</span><span>상반신 원화</span><span>몸·얼굴 파츠 나누기 (약 40분)</span><span>입·웃는 눈 그림</span><span>리깅</span><span>모델</span></div>
    </div></div></div>
    <div class="view" data-v="model"></div>
    <div class="view" data-v="making"><div class="center"><div class="making" id="making"></div></div></div>
    <div class="view" data-v="parts"><div class="space3" id="space3"><div class="space" id="space"></div></div><div class="cards" id="cards" hidden></div>
      <div class="empty-note" id="partsEmpty" hidden></div><div class="floatbar" id="partsBar"></div></div>
    <div class="view" data-v="pics"><div class="pic" id="pic"></div></div>
  </section>
</main>
<aside class="insp" id="insp"><header id="inspHead"></header><div class="keybox" id="keyBox" hidden>OpenAI API 키가 필요합니다 (원화·입·웃는 눈 그림)
  <input id="keyInput" type="password" placeholder="sk-..." autocomplete="off"></div><div class="body" id="inspBody"></div></aside>
<div class="dropover" id="dropover"><div>여기에 놓으면 새 모델을 만듭니다</div></div>
<div class="toast" id="toast"></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const getJson = async u => { try { const r = await fetch(u, { cache: 'no-store' }); return r.ok ? await r.json() : null; } catch { return null; } };
  const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 4000); };
  const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/></svg>';

  const stepsOf = j => Object.keys(j.steps || {});
  const fin = s => s?.status === 'done' || s?.status === 'skipped';
  const PICS = [['input', '올린 그림', null], ['prepared.png', '다듬은 그림', 'prepare'], ['base.png', '상반신 원화', 'base'], ['front.png', '정면', 'front'],
                ['head.png', '머리 크롭', 'headcrop'], ['mouth.png', '입 벌림', 'mouth'], ['smile.png', '웃는 눈', 'smile'], ['ears.png', '귀 덮은 머리', 'ears']];
  const fmtTime = t => t ? new Date(t * 1000).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
  const dur = (a, b) => { if (!a) return ''; const s = Math.round(((b || Date.now() / 1000) - a)); return s < 60 ? s + '초' : Math.floor(s / 60) + '분 ' + (s % 60) + '초'; };
  const inputOf = j => `../work/${j.id}/` + (j.input || 'input.png');
  const thumbOf = j => `../work/${j.id}/` + (j.steps?.base?.status === 'done' ? 'base.png' : j.steps?.front?.status === 'done' ? 'front.png' : (j.input || 'input.png'));
  const running = j => j.state === 'running' || j.state === 'starting';
  const ready = j => j.steps?.rig?.status === 'done';
  const STATE = { running: ['만드는 중', 'run'], starting: ['시작하는 중', 'run'], done: ['완성', 'ok'], error: ['멈춤', 'bad'] };

  // ---------- state: the job and what the stage shows (in the address: #job/mode) ----------
  let jobs = [], cfg = {};

  let picSel = 0, showSteps = false;           // a finished model hides its steps unless asked ('단계')

  const go = (id, m) => {
    if (id !== sel || (m && m !== mode)) { memo.insp = memo.parts = memo.pics = memo.bar = memo.model = memo.making = null; }
    sel = id; mode = m || mode;

  async function refresh() {
    const d = await getJson('/api/v2/jobs');

  function render() {

  // ---------- rail ----------

  // ---------- top bar: the job | what the stage shows | what you can do with it ----------
  function renderBar(j) {
    const all = stepsOf(j), nDone = all.filter(k => fin(j.steps[k])).length;
    const k = JSON.stringify([j.id, j.name, j.state, nDone, mode, ready(j), showSteps]);

  function rename(j, h) {
    if (h.isContentEditable) return;

      const r = await fetch(`/api/v2/jobs/${j.id}/options`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: nm }) });
      if (!r.ok) toast('이름을 바꾸지 못했습니다');
      memo.rail = memo.bar = null; refresh();

    h.onblur = () => done(true);

  const showView = v => { for (const e of $('stage').children) e.classList.toggle('on', e.dataset.v === v); };
  const viewerSrc = j => `../viewer/index.html?model=../bundles/${j.id}/model.json&zoom=1.3&cy=580&panel=auto&theme=dark&v=${j.steps.rig.finished}`;

  // the hair over the ears: from the picture drawn with the ears covered (GPT) or the picture's own hair.
  // Automatic = only when an ear peeks out between the locks (pipeline.ear_cover)
  function earOption(j) {
    const cur = j.options?.earCover, seg = el('div', 'seg');
    seg.title = '귀 덮은 머리 그림을 쓸지. 자동: 귀가 머리카락 사이로 보일 때만 씀 (귀가 드러나 있거나 이미 가려진 그림은 원본 머리)';
    for (const [v, t] of [[undefined, '자동'], [true, '씀'], [false, '안 씀']]) {
      const b = el('button', cur === v ? 'on' : null, t);
      b.disabled = running(j);
      b.onclick = async () => {
        if (cur === v) return;

  async function rerun(j, step, quiet) {

  const KO = { 'back hair': '뒷머리', 'front hair': '앞머리', face: '얼굴', neck: '목', topwear: '상의', bottomwear: '하의', legwear: '다리', handwear: '팔', footwear: '신발',

  const ko = n => { const s = /_r$/.test(n) ? ' R' : /_l$/.test(n) ? ' L' : ''; const b = n.replace(/@body$/, '').replace(/_[rl]$/, ''); return (KO[b] || b) + s + (n.endsWith('@body') ? ' (몸 쪽)' : ''); };
  const GROUPS = [['머리카락', /hair/], ['눈썹', /^eyebrow/], ['눈', /^(eye|irides|pupil|highlight|lash|smileeye|fx (heart|sparkle))/], ['입', /^mouth/], ['얼굴', /^(face|nose|ears|earwear|fx)/], ['몸 · 옷', /./]];

    ears: ['귀 덮은 머리', 'GPT가 귀를 머리카락으로 덮어 다시 그린 그림을 나눈 레이어. 모델의 앞머리는 여기(이 그림의 색)에서 가져옵니다.'],

  const P = { key: null, L: null, m: null, set: null, spread: 0.85, off: new Set() };

  async function drawParts(j) {
    showView('parts');

      r.append(ti, tx, eye);
      r.onclick = () => openLb(items, i);
      r.onmouseenter = () => imgs[i]?.classList.add('hl'); r.onmouseleave = () => imgs[i]?.classList.remove('hl');
      rows[i] = r;
    });
    for (let i = n - 1; i >= 0; i--) list.append(rows[i]);
    $('inspBody').replaceChildren(list);
    // the stack
    const space = $('space'), st = $('space3');
    space.replaceChildren();
    const W = st.clientWidth || 900, H = st.clientHeight || 600, S = Math.min(W * 0.55, H * 0.62) / Math.max(CW, CH);
    const plate = el('div', 'plate'); Object.assign(plate.style, { width: CW * S + 'px', height: CH * S + 'px', left: -CW * S / 2 + 'px', top: -CH * S / 2 + 'px' }); space.append(plate);
    D.layers.forEach((ly, i) => {
      const im = el('img'); im.src = items[i].src; im.title = `${ko(ly.name)} (${ly.name})`; im.alt = '';
      const [x, y, w, hh] = ly.box; Object.assign(im.style, { left: (x - CW / 2) * S + 'px', top: (y - CH / 2) * S + 'px', width: w * S + 'px', height: hh * S + 'px' });
      if (P.off.has(i)) im.classList.add('dim');
      im.onmouseenter = () => { rows[i].classList.add('hl'); rows[i].scrollIntoView({ block: 'nearest' }); }; im.onmouseleave = () => rows[i].classList.remove('hl');
      im.onclick = () => openLb(items, i);
      space.append(im); imgs.push(im);
    });
    const place = () => {
      const t = P.spread = Number(sp.value);
      space.style.transform = `rotateX(${58 * t}deg) rotateZ(${-30 * t}deg) scale(${1 - 0.2 * t})`;
      const gap = Math.min(Math.max(30, 700 / n), (H * 0.5) / Math.max(1, n - 1) / Math.sin(58 * Math.PI / 180) / 0.8) * t;
      imgs.forEach((im, i) => { im.style.transform = `translateZ(${(i - (n - 1) / 2) * gap}px)`; });
      plate.style.transform = `translateZ(${(-(n - 1) / 2 - 1) * gap}px)`; plate.style.opacity = t;
    };
    sp.oninput = place; place();
  }

  function rigCards(j) {
    $('space3').hidden = true;
    const cards = $('cards'); cards.hidden = false;
    const groups = GROUPS.map(([t]) => [t, []]), items = [];
    for (const p of P.m.parts) if (!p.maskOnly) groups[GROUPS.findIndex(([, re]) => re.test(p.name))][1].push(p);
    const list = el('ul', 'rows'), out = [];
    for (const [t, ps] of groups) {
      if (!ps.length) continue;
      const gr = el('div', 'gr'), gh = el('li', 'gh'); gh.append(el('span', null, t), el('span', null, ps.length + '개')); list.append(gh);
      out.push(el('div', 'gh', `${t} · ${ps.length}`), gr);
      for (const p of ps) {
        const keys = [...Object.keys(p.keys || {}), ...Object.keys(p.opacity || {})].filter(k => !/^sway/.test(k));
        const it = { src: `../bundles/${j.id}/${p.texture}`, name: ko(p.name), sub: `${p.name} · 격자 ${p.grid.nx}×${p.grid.ny} · ${keys.join(' ') || '키폼 없음'}` };
        const i = items.push(it) - 1;
        const c = el('div', 'card'), im = el('div', 'im'), img = el('img'); img.src = it.src; img.loading = 'lazy'; img.alt = ''; im.append(img);
        c.append(im, el('div', 'nm', it.name), el('div', 'k', keys.join(' ') || '-')); c.onclick = () => openLb(items, i); gr.append(c);
        const r = el('li', 'rw'), ti = el('div', 'ti'), im2 = el('img'); im2.src = it.src; im2.loading = 'lazy'; im2.alt = ''; ti.append(im2);
        const tx = el('div'); tx.append(el('div', 'nm', it.name), el('div', 'k', `${p.grid.nx}×${p.grid.ny} · ${keys.join(' ') || '-'}`));
        r.append(ti, tx, el('span')); r.onclick = () => openLb(items, i);
        r.onmouseenter = () => { c.classList.add('hl'); c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }; r.onmouseleave = () => c.classList.remove('hl');
        c.onmouseenter = () => { r.classList.add('hl'); r.scrollIntoView({ block: 'nearest' }); }; c.onmouseleave = () => r.classList.remove('hl');
        list.append(r);
      }
    }
    cards.replaceChildren(...out);
    $('inspBody').replaceChildren(list);
  }

  // ---------- 그림: the pictures the pipeline made, one large ----------
  function stagePics(j) {
    showView('pics');
    const items = PICS.filter(([, , step]) => !step || j.steps?.[step]?.status === 'done')
      .map(([f, cap, step]) => ({ src: f === 'input' ? inputOf(j) : `../work/${j.id}/${f}?v=${j.steps?.[step]?.finished || 0}`, name: cap, sub: f === 'input' ? '올린 그림' : f }));
    picSel = Math.max(0, Math.min(picSel, items.length - 1));
    const k = j.id + ':' + picSel + ':' + items.map(x => x.src).join('|');
    if (memo.pics === k) return;
    memo.pics = k;
    $('inspHead').innerHTML = '<h2>그림</h2><p>파이프라인이 만든 그림들. 가운데 그림을 누르면 확대해서 봅니다.</p>';
    const list = el('ul', 'rows');
    items.forEach((it, i) => {
      const r = el('li', 'rw' + (i === picSel ? ' sel' : '')), ti = el('div', 'ti'), im = el('img'); im.src = it.src; im.alt = ''; ti.append(im);
      const tx = el('div'); tx.append(el('div', 'nm', it.name), el('div', 'k', it.sub));
      r.append(ti, tx, el('span')); r.style.cursor = 'pointer';
      r.onclick = () => { picSel = i; stagePics(j); };
      list.append(r);
    });
    $('inspBody').replaceChildren(list);
    const big = el('img'); big.src = items[picSel]?.src || ''; big.alt = items[picSel]?.name || '';
    big.onclick = () => openLb(items, picSel);
    $('pic').replaceChildren(big);
  }

  // ---------- one part / picture, large: − + or wheel, drag, ← → the next one, Esc ----------
  const lb = { el: null, list: [], i: 0, z: 1, x: 0, y: 0 };
  function openLb(list, i) {
    if (!lb.el) {
      lb.el = el('div', 'lb');
      lb.el.innerHTML = `<div class="lbar"><button class="btn" data-a="prev" aria-label="이전">‹</button><button class="btn" data-a="next" aria-label="다음">›</button>
        <b></b><span class="m"></span><button class="btn" data-a="out" aria-label="축소">−</button><span class="zv"></span>
        <button class="btn" data-a="in" aria-label="확대">+</button><button class="btn" data-a="fit">맞춤</button><button class="btn" data-a="close" aria-label="닫기">✕</button></div><div class="view"><img alt=""></div>`;
      document.body.append(lb.el);
      const view = lb.el.querySelector('.view'), img = lb.el.querySelector('img');
      img.onload = () => fitLb();
      lb.el.querySelector('.lbar').onclick = e => {
        const a = e.target.closest('button')?.dataset.a; if (!a) return;
        if (a === 'close') closeLb(); else if (a === 'prev') showLb(lb.i - 1); else if (a === 'next') showLb(lb.i + 1);
        else if (a === 'in') zoomLb(1.25); else if (a === 'out') zoomLb(1 / 1.25); else if (a === 'fit') fitLb();
      };
      view.addEventListener('wheel', e => { e.preventDefault(); zoomLb(e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
      let d = null;
      view.onpointerdown = e => { d = { x: e.clientX, y: e.clientY, ox: lb.x, oy: lb.y }; view.setPointerCapture(e.pointerId); view.classList.add('drag'); };
      view.onpointermove = e => { if (d) { lb.x = d.ox + e.clientX - d.x; lb.y = d.oy + e.clientY - d.y; placeLb(); } };
      view.onpointerup = view.onpointercancel = () => { d = null; view.classList.remove('drag'); };
      addEventListener('keydown', e => {
        if (!lb.el.classList.contains('on')) return;
        const k = e.key;
        if (k === 'Escape') closeLb(); else if (k === 'ArrowLeft') showLb(lb.i - 1); else if (k === 'ArrowRight') showLb(lb.i + 1);
        else if (k === '+' || k === '=') zoomLb(1.25); else if (k === '-') zoomLb(1 / 1.25); else return;
        e.preventDefault();
      });
    }
    lb.list = list; lb.el.classList.add('on'); showLb(i);
  }
  function showLb(i) {
    const n = lb.list.length; lb.i = (i + n) % n;
    const it = lb.list[lb.i], img = lb.el.querySelector('img');
    lb.el.querySelector('.lbar b').textContent = it.name;
    lb.el.querySelector('.lbar .m').textContent = `${it.sub}   (${lb.i + 1}/${n})`;
    if (img.getAttribute('src') !== it.src) img.src = it.src; else fitLb();
  }
  function fitLb() {
    const img = lb.el.querySelector('img'), v = lb.el.querySelector('.view');
    lb.z = Math.min(v.clientWidth * 0.92 / (img.naturalWidth || 1), v.clientHeight * 0.92 / (img.naturalHeight || 1)); lb.x = lb.y = 0; placeLb();
  }
  function zoomLb(f) { lb.z = Math.max(0.05, Math.min(40, lb.z * f)); lb.x *= f; lb.y *= f; placeLb(); }
  function placeLb() {
    const img = lb.el.querySelector('img');
    img.style.transform = `translate(${lb.x - img.naturalWidth * lb.z / 2}px, ${lb.y - img.naturalHeight * lb.z / 2}px) scale(${lb.z})`;
    lb.el.querySelector('.zv').textContent = Math.round(lb.z * 100) + '%';
  }
  function closeLb() { lb.el.classList.remove('on'); }

  // ---------- a new picture: the + button, or drop it anywhere ----------
  async function upload(file) {
    const r = await fetch('/api/v2/jobs', { method: 'POST', body: file, headers: { 'X-Name': encodeURIComponent(file.name.replace(/\.[^.]+$/, '')) } });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { toast(d.error || '올리지 못했습니다'); return; }
    go(d.id, 'model'); refresh();
  }
  $('newBtn').onclick = () => $('file').click();
  $('file').onchange = e => { if (e.target.files[0]) upload(e.target.files[0]); e.target.value = ''; };
  let dragDepth = 0;
  addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dragDepth++; $('dropover').classList.add('on'); } });
  addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('dropover').classList.remove('on'); } });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('dropover').classList.remove('on'); const f = e.dataTransfer.files[0]; if (f) upload(f); });
  $('keyInput').onchange = async e => {
    const r = await fetch('/api/redraw/key', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: e.target.value }) });
    e.target.value = ''; if (!r.ok) toast('키를 저장하지 못했습니다'); refresh();
  };
  let rz;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (mode === 'parts') { memo.parts = null; render(); } }, 200); });
  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
