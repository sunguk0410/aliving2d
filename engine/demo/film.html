<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><style>body{margin:0;background:#20222c;color:#ddd;font:12px sans-serif}.g{display:flex;gap:4px;padding:4px;flex-wrap:wrap}.c{text-align:center}img{width:150px;height:200px;background:#2c2f3d;display:block}</style></head><body><div class="g" id="g"></div><canvas id="cv" style="width:300px;height:400px;position:absolute;left:-9999px"></canvas>
<script src="../../lib/runtime.js"></script><script src="../../lib/renderer.js"></script><script src="../core.js"></script><script src="../animator.js"></script><script src="../player.js"></script>
<script>
(async()=>{
 const q0=new URLSearchParams(location.search);
 if(q0.get('cw')){const w=Number(q0.get('cw'));cv.style.width=w+'px';cv.style.height=Math.round(w*4/3)+'px';document.head.insertAdjacentHTML('beforeend','<style>img{width:'+w/2+'px;height:'+Math.round(w*2/3)+'px}</style>');}
 const q=q0, bundle=q.get('b')||'sampleA', trig=q.get('t')||'AWAY', lv=Number(q.get('i')||3);
 const p=await CapsulePlayer.load(cv,'../../bundles/'+bundle+'/',{focus:'upper',autoplay:false,auto:{rand:false,blink:false},pixelRatio:1,preserveDrawingBuffer:true});
 // ?from={params}&to={params}: hold one pose, then jump to the other (springs, hair) instead of a reaction
 const from=q.get('from')?JSON.parse(q.get('from')):null,to=q.get('to')?JSON.parse(q.get('to')):null;
 if(from){p.setAuto('idle',false);p.setParams(from);}
 for(let i=0;i<30;i++)p.step(1/30);
 const ramp=Number(q.get('ramp')||0);   // ms to blend from -> to (0 = jump)
 if(!to)p.react(trig,lv);else if(!ramp)p.setParams(to); let t=0;
 const pose=ms=>{if(!to||!ramp)return;const k=Math.min(1,ms/ramp),o={};for(const key in to)o[key]=(from&&key in from?from[key]:0)+(to[key]-(from&&key in from?from[key]:0))*k;p.setParams(o);};
 const step=Number(q.get('dt')||250), total=Number(q.get('ms')||3000);
 for(let ms=0;ms<=total;ms+=step){
   while(t<ms){pose(t);p.step(1/60);t+=1000/60;}
   const d=document.createElement('div');d.className='c';d.innerHTML='<img src="'+cv.toDataURL()+'"><div>'+ms+'ms</div>';g.appendChild(d);
 }
 window.__done=true;
})();
</script></body></html>
