<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>capsule-rig 데모 · 스터디룸</title>
<style>
  :root { --bg:#14151c; --panel:#1d1f2a; --line:#2c2f3d; --ink:#e9e9f0; --dim:#9a9cb0; --accent:#8fb4ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; }
  header h1 { font-size:16px; margin:0; }
  header span { color:var(--dim); font-size:13px; }
  .room { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; padding:24px; }
  .slot { background:linear-gradient(#2a2d3d, #1b1d27); border:1px solid var(--line); border-radius:12px; overflow:hidden; position:relative; }
  .slot canvas { display:block; width:100%; aspect-ratio:3/4; }
  .slot .name { position:absolute; left:12px; top:10px; font-size:12px; color:var(--dim); }
  .slot .state { position:absolute; left:12px; bottom:10px; font-size:12px; color:var(--accent); font-variant-numeric:tabular-nums; }
  .slot.selected { outline:2px solid var(--accent); }
  .controls { padding:0 24px 24px; display:grid; grid-template-columns: 1.4fr 1fr; gap:16px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .box h2 { font-size:13px; margin:0 0 10px; color:var(--dim); font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px; }
  button, select { background:#272a38; color:var(--ink); border:1px solid #3a3e52; border-radius:8px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:#33415f; border-color:var(--accent); }
  .seg button { border-radius:0; margin-left:-1px; }
  .seg button:first-child { border-radius:8px 0 0 8px; } .seg button:last-child { border-radius:0 8px 8px 0; }
  #log { font:12px/1.6 ui-monospace, monospace; color:var(--dim); height:120px; overflow:auto; white-space:pre-wrap; }
  label.small { color:var(--dim); font-size:12px; margin-right:4px; }
</style>
</head>
<body>
<header><h1>스터디룸 데모</h1><span>capsule-rig · 캐릭터를 클릭해서 선택하고 반응을 보내 보세요</span></header>

<div class="room" id="room"></div>

<div class="controls">
  <div class="box">
    <h2>상황 반응 (trigger_type)</h2>
    <div class="row">
      <label class="small">강도</label>
      <span class="seg" id="intensity">
        <button data-v="1" class="on">1 눈치</button><button data-v="2">2 말 걸기</button><button data-v="3">3 서운함</button>
      </span>
      <button id="toAll">전체에게 보내기: 꺼짐</button>
    </div>
    <div class="row" id="triggers"></div>
    <h2 style="margin-top:14px">표정 / 모션</h2>
    <div class="row">
      <select id="expr"></select><button id="exprHold">2초 유지</button><button id="exprBase">기본 표정으로</button>
      <select id="motion"></select><button id="motionPlay">재생</button>
    </div>
    <div class="row">
      <button id="talk">말하기 (LLM 답변 표시 중)</button>
      <button id="idle" class="on">대기 동작</button>
      <button id="rand" class="on">랜덤 시선</button>
      <button id="phys" class="on">머리 물리</button>
    </div>
  </div>
  <div class="box"><h2>이벤트 로그</h2><div id="log"></div></div>
</div>

<script src="../../lib/runtime.js"></script>
<script src="../../lib/renderer.js"></script>
<script src="../core.js"></script>
<script src="../animator.js"></script>
<script src="../player.js"></script>
<script>
// ?bundles=exportA,sampleB picks folders under bundles/ (e.g. an unzipped editor export)
const QUERY_BUNDLES = (new URLSearchParams(location.search).get('bundles') || '').split(',').map(s => s.trim()).filter(s => /^[\w.-]+$/.test(s));
const SLOTS = QUERY_BUNDLES.length
  ? QUERY_BUNDLES.slice(0, 3).map(b => ({ name: b, bundle: '../../bundles/' + b + '/' }))
  : [
    { name: '캐릭터 A', bundle: '../../bundles/sampleA/' },
    { name: '캐릭터 B', bundle: '../../bundles/sampleB/' },
    { name: '캐릭터 A (복제)', bundle: '../../bundles/sampleA/', scale: 0.92 }
  ];
const TRIGGERS = [['GREETING','입장 인사'],['FOCUS_START','집중 시작'],['GAZE_AWAY','시선 이탈'],['AWAY','자리 비움'],['RETURN','복귀'],['LONG_FOCUS','장시간 집중'],['IDLE','대기']];
const players = []; let selected = 0, intensity = 1, toAll = false, talking = false;
const $ = id => document.getElementById(id);
const log = msg => { const el = $('log'); el.textContent = new Date().toLocaleTimeString() + '  ' + msg + '\n' + el.textContent; };
const targets = () => toAll ? players : [players[selected]].filter(Boolean);

(async () => {
  for (const [i, s] of SLOTS.entries()) {
    const div = document.createElement('div'); div.className = 'slot' + (i === 0 ? ' selected' : '');
    div.innerHTML = '<canvas></canvas><div class="name">' + s.name + '</div><div class="state"></div>';
    $('room').appendChild(div);
    const p = await CapsulePlayer.load(div.querySelector('canvas'), s.bundle, { focus: 'upper', scale: s.scale || 1, liveliness: 0.6 });
    p.on('reaction', r => log(s.name + ' ← ' + r.trigger + (r.intensity ? ' (강도 ' + r.intensity + ')' : '') + ' → ' + [r.choice.motion, r.choice.expression].filter(Boolean).join(' + ')));
    div.addEventListener('click', () => { selected = i; document.querySelectorAll('.slot').forEach((d, j) => d.classList.toggle('selected', j === i)); });
    players.push(p);
    setInterval(() => { const st = p.state; div.querySelector('.state').textContent = st.expression + (st.motions.length ? ' · ' + st.motions.join(',') : '') + (st.talking ? ' · 말하는 중' : ''); }, 150);
  }
  const reactions = await (await fetch(SLOTS[0].bundle + 'reactions.json')).json();
  for (const k of Object.keys(reactions.expressions)) $('expr').add(new Option(k, k));
  for (const k of Object.keys(reactions.motions)) $('motion').add(new Option(k, k));
  for (const [t, label] of TRIGGERS) {
    const b = document.createElement('button'); b.textContent = label + ' · ' + t;
    b.onclick = () => targets().forEach(p => p.react(t, intensity));
    $('triggers').appendChild(b);
  }
  setTimeout(() => players.forEach(p => p.react('GREETING')), 600);
  window.__players = players;
})().catch(err => { log('오류: ' + err.message); console.error(err); });

document.querySelectorAll('#intensity button').forEach(b => b.onclick = () => {
  intensity = Number(b.dataset.v); document.querySelectorAll('#intensity button').forEach(x => x.classList.toggle('on', x === b));
});
$('toAll').onclick = () => { toAll = !toAll; $('toAll').textContent = '전체에게 보내기: ' + (toAll ? '켜짐' : '꺼짐'); $('toAll').classList.toggle('on', toAll); };
$('exprHold').onclick = () => targets().forEach(p => p.setExpression($('expr').value, 2000));
$('exprBase').onclick = () => targets().forEach(p => p.setExpression('neutral'));
$('motionPlay').onclick = () => targets().forEach(p => p.play($('motion').value));
$('talk').onclick = () => { talking = !talking; $('talk').classList.toggle('on', talking); targets().forEach(p => p.talk(talking)); };
for (const k of ['idle', 'rand', 'phys']) {
  let on = true; $(k).onclick = () => { on = !on; $(k).classList.toggle('on', on); players.forEach(p => p.setAuto(k, on)); };
}
</script>
</body>
</html>
