<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캡슐 모델 스튜디오</title>
<style>
  :root {
    --bg: #f5f3f0; --panel: #fff; --ink: #1f1f1f; --quiet: #707070; --line: #e2ded8;
    --accent: #3b6fd8; --ok: #2e8b57; --warn: #c48a14; --bad: #c0392b; --run: #3b6fd8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.55 system-ui, "Malgun Gothic", sans-serif; background: var(--bg); color: var(--ink);
         display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 16px 16px 8px; }
  h1 { font-size: 17px; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #eee; color: var(--quiet); }
  .chip.ok { background: #e3f3ea; color: var(--ok); } .chip.warn { background: #fbf0d9; color: var(--warn); }
  .chip.bad { background: #f8e1de; color: var(--bad); }
  .drop { margin: 8px 16px; border: 2px dashed var(--line); border-radius: 10px; padding: 18px 12px; text-align: center;
          cursor: pointer; color: var(--quiet); }
  .drop.over { border-color: var(--accent); color: var(--accent); background: #eef3fd; }
  .drop b { color: var(--ink); display: block; margin-bottom: 4px; }
  .key { margin: 0 16px 8px; font-size: 12px; color: var(--quiet); }
  .key input { width: 100%; margin-top: 4px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
  .list { overflow: auto; flex: 1; border-top: 1px solid var(--line); }
  .job { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; align-items: center; }
  .job:hover { background: #faf8f5; } .job.sel { background: #eef3fd; }
  .job img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: #eee; flex: none; }
  .job .t { font-weight: 600; } .job .s { font-size: 12px; color: var(--quiet); }
  main { overflow: auto; padding: 20px 24px; min-width: 0; }
  .empty { color: var(--quiet); margin-top: 20vh; text-align: center; }
  .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .head h2 { margin: 0; font-size: 20px; }
  .grid { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 20px; margin-top: 16px; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .opts { margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .opts .m { color: var(--quiet); font-size: 12px; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; padding: 7px 0; border-bottom: 1px solid #f0ede8; align-items: start; }
  .steps li:last-child { border-bottom: 0; }
  .dot { width: 14px; height: 14px; border-radius: 50%; margin-top: 3px; background: #ddd; }
  .dot.done { background: var(--ok); } .dot.running { background: var(--run); animation: pulse 1.2s infinite; }
  .dot.error { background: var(--bad); } .dot.waiting { background: #ddd; }
  @keyframes pulse { 50% { opacity: .35; } }
  .st .n { font-weight: 600; } .st .m { font-size: 12px; color: var(--quiet); } .st .e { font-size: 12px; color: var(--bad); white-space: pre-wrap; }
  .bar { height: 4px; background: #eee; border-radius: 4px; margin-top: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--run); }
  button { font: inherit; padding: 5px 10px; border: 1px solid var(--line); background: #fafafa; border-radius: 6px; cursor: pointer; }
  button:hover { background: #f0f0f0; } button.small { font-size: 12px; padding: 2px 8px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-top: 12px; }
  .thumbs figure { margin: 0; } .thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; background: #eee; border: 1px solid var(--line); }
  .thumbs figcaption { font-size: 12px; color: var(--quiet); text-align: center; }
  .viewer { height: min(78vh, 760px); padding: 0; overflow: hidden; }
  .viewer { position: relative; }
  .viewer iframe { width: 100%; height: 100%; border: 0; display: block; }
  .viewer > a { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--quiet); }
  .viewer .wait { display: grid; place-items: center; height: 100%; color: var(--quiet); text-align: center; padding: 20px; }
  .err { color: var(--bad); font-size: 13px; margin: 0 16px 8px; }

  /* 파츠 분리: AI layers (body / head PSD, layer_preview.py) and the rig's parts */
  .split { margin-top: 20px; padding: 0; overflow: hidden; }
  .split .tabs { display: flex; gap: 4px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .split .tabs .t { padding: 4px 10px; border-radius: 6px; cursor: pointer; color: var(--quiet); }
  .split .tabs .t.on { background: #eef3fd; color: var(--accent); font-weight: 600; }
  .split .tabs .sp { flex: 1; } .split .tabs .m { font-size: 12px; color: var(--quiet); }
  .split .tabs input[type=range] { width: 140px; accent-color: var(--accent); }
  .stage { position: relative; height: 460px; perspective: 2200px; overflow: hidden; background: #f0ede8; display: none; }
  .space { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.2,.8,.2,1); }
  .space img { position: absolute; transition: transform .8s cubic-bezier(.2,.8,.2,1), opacity .25s, filter .25s; }
  .space img.dim { opacity: .08; } .space img.hl { filter: drop-shadow(0 0 2px var(--accent)) drop-shadow(0 0 2px var(--accent)); }
  .space .plate { position: absolute; border: 1px solid #0002; background: #fff8; transition: transform .8s cubic-bezier(.2,.8,.2,1), opacity .5s; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; padding: 12px; }
  .pgrid .gh { grid-column: 1 / -1; font-weight: 600; font-size: 13px; padding-top: 4px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  .pgrid .gh span:last-child { color: var(--quiet); font-weight: 400; }
  .pc { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); cursor: pointer; }
  .pc .im { height: 104px; display: grid; place-items: center; padding: 6px; background: repeating-conic-gradient(#f1efec 0% 25%, #fff 0% 50%) 50% / 12px 12px; }
  .pc .im img { max-width: 100%; max-height: 92px; object-fit: contain; }
  .pgrid { align-items: start; }
  .pc .nm { font-size: 12.5px; padding: 4px 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pc .k { font-size: 11px; color: var(--quiet); padding: 0 8px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pc.off { opacity: .4; } .pc:hover, .pc.hl { border-color: var(--accent); }
  .split .none { padding: 24px; color: var(--quiet); text-align: center; }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; height: auto; } .grid { grid-template-columns: 1fr; } aside { max-height: 50vh; } }
</style>
</head>
<body>
<aside>
  <header>
    <h1>캡슐 모델 스튜디오</h1>
    <div class="chips"><span class="chip" id="stChip">see-through 확인 중</span><span class="chip" id="keyChip">OpenAI 키 확인 중</span></div>
  </header>
  <label class="drop" id="drop">
    <b>그림 올리기</b>
    여기에 놓거나 눌러서 고르기 (PNG · JPG · WEBP)
    <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
  </label>
  <div class="key" id="keyBox" hidden>OpenAI API 키가 필요합니다 (정면·입·웃는 눈 그림)
    <input id="keyInput" type="password" placeholder="sk-..." autocomplete="off"></div>
  <div class="err" id="err"></div>
  <div class="list" id="list"></div>
</aside>
<main id="main"><div class="empty">왼쪽에서 그림을 올리거나 작업을 고르세요.<br>그림 한 장 → 상반신 원화 → 몸 · 얼굴 파츠 나누기(약 40분) → 리깅 · 합치기 → 모델</div></main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  // a job lists its own steps (older jobs have the older step names)
  const stepsOf = j => Object.keys(j.steps || {});
  const PICS = [['input', '올린 그림', null], ['prepared.png', '다듬은 그림', 'prepare'], ['base.png', '상반신 원화', 'base'], ['front.png', '정면', 'front'],
                ['head.png', '머리 크롭', 'headcrop'], ['mouth.png', '입 벌림', 'mouth'], ['smile.png', '웃는 눈', 'smile']];
  let jobs = [], sel = location.hash.slice(1) || null, viewerFor = null, cfg = {};

  const fmtTime = t => t ? new Date(t * 1000).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
  const dur = (a, b) => { if (!a) return ''; const s = Math.round(((b || Date.now() / 1000) - a)); return s < 60 ? s + '초' : Math.floor(s / 60) + '분 ' + (s % 60) + '초'; };
  const inputOf = j => `../work/${j.id}/` + (j.input || 'input.png');
  const stateText = j => ({ running: '진행 중', starting: '시작하는 중', done: '완성', error: '멈춤' })[j.state] || j.state || '';

  async function refresh() {
    try {
      const r = await fetch('/api/v2/jobs', { cache: 'no-store' });
      const d = await r.json();
      jobs = d.jobs; cfg = d;
      const st = d.seethrough;
      $('stChip').textContent = st ? (st.busy ? 'see-through 작업 중' : 'see-through 켜짐') : 'see-through 서버 꺼짐 (직접 실행)';
      $('stChip').className = 'chip ' + (st ? (st.busy ? 'warn' : 'ok') : 'warn');
      const k = d.openai || {};
      $('keyChip').textContent = k.ready ? 'OpenAI 키 ' + (k.hint || '') : 'OpenAI 키 없음';
      $('keyChip').className = 'chip ' + (k.ready ? 'ok' : 'bad');
      $('keyBox').hidden = !!k.ready;
      renderList(); renderMain();
    } catch (e) { $('err').textContent = '서버에 연결하지 못했습니다: ' + e; }
  }

  function renderList() {
    $('list').replaceChildren(...jobs.map(j => {
      const el = document.createElement('div');
      el.className = 'job' + (j.id === sel ? ' sel' : '');
      const done = stepsOf(j).filter(k => j.steps[k].status === 'done').length;
      el.innerHTML = `<img alt=""><div><div class="t"></div><div class="s"></div></div>`;
      el.querySelector('img').src = `../work/${j.id}/` + (j.steps?.base ? 'base.png' : 'front.png');
      el.querySelector('img').onerror = e => { e.target.onerror = null; e.target.src = inputOf(j); };
      el.querySelector('.t').textContent = j.name || j.id;
      el.querySelector('.s').textContent = `${stateText(j)} · ${done}/${stepsOf(j).length} · ${fmtTime(j.created)}`;
      el.onclick = () => { sel = j.id; location.hash = j.id; renderList(); renderMain(); };
      return el;
    }));
  }

  function renderMain() {
    const j = jobs.find(x => x.id === sel);
    if (!j) return;
    const main = $('main');
    if (main.dataset.job !== j.id) { main.dataset.job = j.id; main.innerHTML = ''; viewerFor = null; }
    if (!main.firstChild) {
      main.innerHTML = `<div class="head"><h2></h2><span class="chip" id="jstate"></span><span class="m" style="color:var(--quiet)"></span><button class="small" id="stopBtn" hidden>멈추기</button></div>
        <div class="grid"><div><div class="card"><ul class="steps" id="steps"></ul></div>
        <div class="card opts"><label><input type="checkbox" id="optEars"> 귀 숨기기</label>
          <span class="m">더 넣기:</span>
          <label><input type="checkbox" data-extra="physics"> 머리카락 흔들림</label>
          <label><input type="checkbox" data-extra="body"> 몸 움직임</label>
          <label><input type="checkbox" data-extra="arms"> 팔</label>
          <label><input type="checkbox" data-extra="fx"> 효과(홍조·눈물…)</label>
          <label><input type="checkbox" data-extra="presets"> 기본 표정 27개</label>
          <span class="m">기본은 담백한 모델(고개·눈·깜빡임·입). 바꾸면 리깅만 다시 합니다 (1~2분)</span></div>
        <div class="thumbs" id="thumbs"></div></div>
        <div class="card viewer" id="viewer"></div></div>
        <div class="card split" id="split"><div class="tabs" id="splitTabs"></div><div class="stage" id="stage"><div class="space" id="space"></div></div><div id="splitBody"></div></div>`;
    }
    main.querySelector('h2').textContent = j.name || j.id;
    main.querySelector('.head .m').textContent = fmtTime(j.created);
    $('jstate').textContent = stateText(j);
    $('jstate').className = 'chip ' + ({ done: 'ok', error: 'bad', running: 'warn', starting: 'warn' }[j.state] || '');
    const running = j.state === 'running' || j.state === 'starting';
    $('stopBtn').hidden = !running;
    $('stopBtn').onclick = async () => {
      if (!confirm('이 작업을 멈출까요? 멈춘 뒤 원하는 단계부터 다시 돌릴 수 있습니다.')) return;
      const r = await fetch(`/api/v2/jobs/${j.id}/stop`, { method: 'POST' });
      if (!r.ok) $('err').textContent = '멈추지 못했습니다';
      setTimeout(refresh, 300);
    };
    const ears = $('optEars');
    ears.checked = j.options?.ears === false;
    ears.disabled = running;
    ears.onchange = async () => {
      const v = !ears.checked;
      const r = await fetch(`/api/v2/jobs/${j.id}/options`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ears: v }) });
      if (!r.ok) { $('err').textContent = '옵션을 저장하지 못했습니다'; return; }
      if (j.steps?.head?.status === 'done') rerun(j.id, 'rig'); else setTimeout(refresh, 300);
    };
    const extras = new Set(j.options?.extras || []);
    for (const box of main.querySelectorAll('[data-extra]')) {
      box.checked = extras.has(box.dataset.extra);
      box.disabled = running;
      box.onchange = async () => {
        const list = [...main.querySelectorAll('[data-extra]')].filter(b => b.checked).map(b => b.dataset.extra);
        const r = await fetch(`/api/v2/jobs/${j.id}/options`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ extras: list }) });
        if (!r.ok) { $('err').textContent = '옵션을 저장하지 못했습니다'; return; }
        if (j.steps?.head?.status === 'done') rerun(j.id, 'rig'); else setTimeout(refresh, 300);
      };
    }
    $('steps').replaceChildren(...stepsOf(j).map(k => {
      const s = j.steps?.[k] || { status: 'waiting' };
      const li = document.createElement('li');
      li.innerHTML = `<span class="dot ${s.status}"></span><div class="st"><div class="n"></div><div class="m"></div></div><div></div>`;
      li.querySelector('.n').textContent = s.label || k;
      const m = li.querySelector('.m');
      m.textContent = s.status === 'done' ? '완료 · ' + dur(s.started, s.finished)
        : s.status === 'running' ? '진행 중 · ' + dur(s.started) + (s.progress ? ' · ' + s.progress : '')
        : s.status === 'error' ? '실패' : '대기';
      if (s.status === 'running' && typeof s.percent === 'number') {
        const bar = document.createElement('div'); bar.className = 'bar';
        bar.innerHTML = `<i style="width:${Math.max(2, Math.min(100, s.percent))}%"></i>`; m.after(bar);
      }
      if (s.error) { const e = document.createElement('div'); e.className = 'e'; e.textContent = s.error; li.querySelector('.st').append(e); }
      if (!running && (s.status === 'done' || s.status === 'error')) {
        const b = document.createElement('button'); b.className = 'small'; b.textContent = '여기부터 다시';
        b.onclick = () => rerun(j.id, k); li.lastChild.append(b);
      }
      return li;
    }));
    $('thumbs').replaceChildren(...PICS.filter(([, , step]) => !step || j.steps?.[step]).map(([f, cap, step]) => {
      const fig = document.createElement('figure');
      const img = document.createElement('img');
      img.src = f === 'input' ? inputOf(j) : `../work/${j.id}/${f}?v=${j.steps?.[step]?.finished || 0}`;
      img.onerror = () => { img.style.visibility = 'hidden'; };
      const a = document.createElement('a'); a.href = img.src; a.target = '_blank'; a.append(img);
      const c = document.createElement('figcaption'); c.textContent = cap;
      fig.append(a, c); return fig;
    }));
    drawSplit(j);
    const v = $('viewer');
    const ready = j.steps?.rig?.status === 'done';
    const key = ready ? j.id + ':' + j.steps.rig.finished : null;
    if (ready && viewerFor !== key) {
      viewerFor = key;
      const src = `../viewer/index.html?model=../bundles/${j.id}/model.json&zoom=1.6&cy=640`;
      v.innerHTML = `<iframe title="모델 보기"></iframe><a class="small" target="_blank">새 창에서 크게 보기 ↗</a>`;
      v.firstChild.src = src;
      v.lastChild.href = src;
    } else if (!ready && viewerFor !== 'wait:' + j.id) {
      viewerFor = 'wait:' + j.id;
      v.innerHTML = `<div class="wait">모델이 완성되면 여기서 바로 움직여 볼 수 있습니다.<br>몸 · 얼굴 파츠 나누기는 이 PC에서 약 40분 걸립니다.</div>`;
    }
  }


  // ---------- 파츠 분리: how see-through split the picture (AI layers, layer_preview.py) and the parts the rig made ----------
  const KO = { 'back hair': '뒷머리', 'front hair': '앞머리', face: '얼굴', neck: '목', topwear: '상의', bottomwear: '하의', legwear: '다리', handwear: '팔', footwear: '신발',
    ears: '귀', earwear: '귀 장식', eyebrow: '눈썹', eyelash: '속눈썹', eyewhite: '흰자', irides: '눈동자', nose: '코', mouth: '입', headwear: '머리 장식', neckwear: '넥타이·리본', eyewear: '안경', objects: '소품', head: '머리',
    tail: '꼬리', wings: '날개', lash_upper: '윗 속눈썹', lash_lower: '아랫 속눈썹', lash_crease: '쌍꺼풀 선', eyelid: '윗 눈꺼풀', eyelid_low: '아랫 눈꺼풀', pupil: '동공', highlight: '하이라이트', highlight2: '하이라이트 2',
    smileeye: '웃는 눈', mouthmask: '입 마스크', mouth_inner: '입 안', mouth_upper: '윗입술', mouth_lower: '아랫입술', 'fx blush': '홍조', 'fx tears': '눈물', 'fx gloom': '어두운 선', 'fx sweat': '땀', 'fx anger': '분노 마크', 'fx heart': '하트 눈', 'fx sparkle': '반짝 눈' };
  const ko = n => { const s = /_r$/.test(n) ? ' R' : /_l$/.test(n) ? ' L' : ''; const b = n.replace(/@body$/, '').replace(/_[rl]$/, ''); return (KO[b] || b) + s + (n.endsWith('@body') ? ' (몸 쪽)' : ''); };
  const GROUPS = [['머리카락', /hair/], ['눈썹', /^eyebrow/], ['눈', /^(eye|irides|pupil|highlight|lash|smileeye|fx (heart|sparkle))/], ['입', /^mouth/], ['얼굴', /^(face|nose|ears|earwear|fx)/], ['몸 · 옷', /./]];
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const getJson = async u => { try { const r = await fetch(u, { cache: 'no-store' }); return r.ok ? await r.json() : null; } catch { return null; } };
  const split = { key: null, tab: 'head', mode: 'stack', L: null, m: null };

  async function drawSplit(j) {
    const v = [j.steps?.rig, j.steps?.head, j.steps?.body].map(s => (s && s.status === 'done' && s.finished) || 0).join('-');
    const key = j.id + ':' + v;
    if (split.key === key) return;
    split.key = key;
    const [L, m] = await Promise.all([getJson(`../work/${j.id}/layers/layers.json?v=${v}`),
      j.steps?.rig?.status === 'done' ? getJson(`../bundles/${j.id}/model.json?v=${v}`) : null]);
    if (split.key !== key) return;
    split.L = L; split.m = m;
    if (split.tab !== 'parts' && !(L && L[split.tab])) split.tab = L?.head ? 'head' : L?.body ? 'body' : 'parts';
    renderSplit(j);
  }

  function renderSplit(j) {
    const { L, m } = split, tabs = $('splitTabs'), body = $('splitBody'), stage = $('stage'), space = $('space');
    tabs.replaceChildren(el('b', null, '파츠 분리'));
    const nL = k => L?.[k]?.layers.length;
    for (const [k, t, n] of [['body', '몸 레이어', nL('body')], ['head', '얼굴 레이어', nL('head')], ['parts', '리깅 파츠', m && m.parts.filter(p => !p.maskOnly).length]]) {
      const b = el('span', 't' + (k === split.tab ? ' on' : ''), t + (n ? ` ${n}` : ''));
      b.onclick = () => { split.tab = k; renderSplit(j); }; tabs.append(b);
    }
    tabs.append(el('span', 'sp'));
    body.replaceChildren(); space.replaceChildren(); space.style.transform = ''; stage.style.display = 'none';
    if (split.tab === 'parts') {
      if (!m) { body.append(el('div', 'none', '리깅이 끝나면 모델의 파츠가 여기 나옵니다.')); return; }
      tabs.append(el('span', 'm', '파츠마다 변형 격자 칸 수 · 키폼이 걸린 파라미터'));
      const g = el('div', 'pgrid'), groups = GROUPS.map(([t]) => [t, []]);
      for (const p of m.parts) if (!p.maskOnly) groups[GROUPS.findIndex(([, re]) => re.test(p.name))][1].push(p);
      for (const [t, ps] of groups) {
        if (!ps.length) continue;
        const gh = el('div', 'gh'); gh.append(el('span', null, t), el('span', null, ps.length + '개')); g.append(gh);
        for (const p of ps) {
          const c = el('div', 'pc'), im = el('div', 'im'), img = el('img'); img.loading = 'lazy'; img.src = `../bundles/${j.id}/${p.texture}`; im.append(img);
          const keys = [...Object.keys(p.keys || {}), ...Object.keys(p.opacity || {})].filter(k => !/^sway/.test(k));
          c.style.cursor = 'default'; c.title = p.name;
          c.append(im, el('div', 'nm', ko(p.name)), el('div', 'k', `${p.grid.nx}×${p.grid.ny} · ${keys.join(' ') || '-'}`)); g.append(c);
        }
      }
      body.append(g); return;
    }
    const D = L?.[split.tab];
    if (!D) { body.append(el('div', 'none', (split.tab === 'head' ? '얼굴' : '몸') + ' 레이어 분리가 끝나면 see-through가 나눈 레이어가 여기 나옵니다.')); return; }
    for (const [k, t] of [['stack', '펼쳐 보기'], ['grid', '목록만']]) {
      const b = el('span', 't' + (k === split.mode ? ' on' : ''), t); b.onclick = () => { split.mode = k; renderSplit(j); }; tabs.append(b);
    }
    const [CW, CH] = D.size, n = D.layers.length, cards = [], imgs = [];
    const g = el('div', 'pgrid'), gh = el('div', 'gh');
    gh.append(el('span', null, `see-through가 ${split.tab === 'head' ? '얼굴 크롭' : '상반신 그림'}을 ${n}개 레이어로 나눔 (${CW}×${CH}, 아래 → 위 순서)`), el('span', null, '누르면 켜기·끄기'));
    g.append(gh);
    D.layers.forEach((ly, i) => {
      const c = el('div', 'pc'), im = el('div', 'im'), img = el('img'); img.loading = 'lazy'; img.src = `../work/${j.id}/layers/${ly.file}`; im.append(img);
      c.title = ly.name; c.append(im, el('div', 'nm', ko(ly.name)), el('div', 'k', `${ly.name} · ${ly.px.toLocaleString()} px`));
      c.onclick = () => { c.classList.toggle('off'); imgs[i]?.classList.toggle('dim', c.classList.contains('off')); };
      c.onmouseenter = () => imgs[i]?.classList.add('hl'); c.onmouseleave = () => imgs[i]?.classList.remove('hl');
      cards.push(c); g.append(c);
    });
    if (split.mode === 'stack') {
      stage.style.display = 'block';
      const sp = el('input'); sp.type = 'range'; sp.min = 0; sp.max = 1; sp.step = 0.01; sp.value = 0.85;
      tabs.append(el('span', 'm', '겹침 ↔ 펼침'), sp);
      const W = stage.clientWidth || 800, H = stage.clientHeight || 460, S = Math.min(W * 0.5, H * 0.6) / Math.max(CW, CH);
      const plate = el('div', 'plate'); Object.assign(plate.style, { width: CW * S + 'px', height: CH * S + 'px', left: -CW * S / 2 + 'px', top: -CH * S / 2 + 'px' }); space.append(plate);
      D.layers.forEach((ly, i) => {
        const im = el('img'); im.src = `../work/${j.id}/layers/${ly.file}`; im.title = `${ko(ly.name)} (${ly.name})`;
        const [x, y, w, hh] = ly.box; Object.assign(im.style, { left: (x - CW / 2) * S + 'px', top: (y - CH / 2) * S + 'px', width: w * S + 'px', height: hh * S + 'px' });
        im.onmouseenter = () => cards[i].classList.add('hl'); im.onmouseleave = () => cards[i].classList.remove('hl');
        space.append(im); imgs.push(im);
      });
      const place = () => {
        const t = Number(sp.value);
        space.style.transform = `rotateX(${58 * t}deg) rotateZ(${-30 * t}deg) scale(${1 - 0.22 * t})`;
        const gap = Math.min(Math.max(30, 700 / n), (H * 0.5) / Math.max(1, n - 1) / Math.sin(58 * Math.PI / 180) / 0.78) * t;
        imgs.forEach((im, i) => { im.style.transform = `translateZ(${(i - (n - 1) / 2) * gap}px)`; });
        plate.style.transform = `translateZ(${(-(n - 1) / 2 - 1) * gap}px)`; plate.style.opacity = t;
      };
      sp.oninput = place; place();
    }
    body.append(g);
  }

  async function rerun(id, step) {
    const r = await fetch(`/api/v2/jobs/${id}/rerun?from=${step}`, { method: 'POST' });
    if (!r.ok) $('err').textContent = (await r.json()).error || '다시 시작하지 못했습니다';
    setTimeout(refresh, 500);
  }

  async function upload(file) {
    $('err').textContent = '';
    const r = await fetch('/api/v2/jobs', { method: 'POST', body: file, headers: { 'X-Name': encodeURIComponent(file.name.replace(/\.[^.]+$/, '')) } });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $('err').textContent = d.error || '올리지 못했습니다'; return; }
    sel = d.id; location.hash = d.id; refresh();
  }

  const drop = $('drop');
  $('file').onchange = e => e.target.files[0] && upload(e.target.files[0]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) upload(f); };
  $('keyInput').onchange = async e => {
    const r = await fetch('/api/redraw/key', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: e.target.value }) });
    e.target.value = ''; if (!r.ok) $('err').textContent = '키를 저장하지 못했습니다'; refresh();
  };
  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
