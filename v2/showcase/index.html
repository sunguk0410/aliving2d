<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aliving2D Studio</title>
<style>
  /* a desktop tool (Cubism / DCC dark theme): small type, panels with title bars, tables, one working blue */
  :root {
    --bg: #1d1d1f; --panel: #2a2a2c; --panel2: #313133; --head: #353537; --field: #1f1f21; --line: #141415; --line2: #3e3e41;
    --ink: #d6d6d8; --ink2: #a3a3a7; --quiet: #77777c; --sel: #34507a; --accent: #4a8fe7;
    --ok: #5fb878; --warn: #d9a441; --bad: #d9534f;
    font: 12px/1.45 "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { display: grid; grid-template-rows: 24px 34px 1fr 22px; height: 100vh; }
  button, input, select { font: inherit; color: inherit; }
  ::selection { background: var(--sel); }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #48484c; border: 2px solid var(--panel); border-radius: 5px; } ::-webkit-scrollbar-track { background: var(--panel); }

  .menubar { display: flex; align-items: center; background: #232325; border-bottom: 1px solid var(--line); padding: 0 6px; white-space: nowrap; overflow: hidden; }
  .menubar .app { display: flex; align-items: center; gap: 6px; font-weight: 600; margin-right: 12px; color: #e8e8ea; }
  .menubar .app i { width: 13px; height: 13px; border-radius: 3px; background: var(--accent); position: relative; }
  .menubar .app i::after { content: ""; position: absolute; inset: 3.5px; border-radius: 50%; background: #232325; }
  .menubar .m { padding: 1px 8px; border-radius: 2px; color: var(--ink2); }
  .menubar .m:hover { background: var(--sel); color: var(--ink); }
  .menubar .r { margin-left: auto; color: var(--quiet); }

  .toolbar { display: flex; align-items: center; gap: 3px; padding: 0 6px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .tb { height: 24px; padding: 0 9px; border: 1px solid transparent; border-radius: 2px; background: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ink2); white-space: nowrap; text-decoration: none; }
  .tb:hover { background: #3a3a3d; border-color: var(--line2); color: var(--ink); }
  .tb:disabled, .tb.off { opacity: .4; pointer-events: none; }
  .tb svg { width: 14px; height: 14px; }
  .sep { width: 1px; height: 18px; background: var(--line2); margin: 0 5px; }

  .work { display: grid; grid-template-columns: 240px 1fr 280px; grid-template-rows: 1fr minmax(330px, 36vh); gap: 2px; padding: 2px; min-height: 0; background: var(--line); }
  .panel { background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .ph { display: flex; align-items: stretch; height: 24px; background: var(--head); border-bottom: 1px solid var(--line); flex: none; }
  .ph .t { display: flex; align-items: center; padding: 0 12px; color: var(--ink2); cursor: default; border-right: 1px solid var(--line); }
  .ph .t.on { background: var(--panel); color: var(--ink); box-shadow: inset 0 2px 0 var(--accent); }
  .ph .t .n { color: var(--quiet); margin-left: 5px; }
  .ph .x { margin-left: auto; display: flex; align-items: center; padding: 0 8px; color: var(--quiet); }
  .pb { flex: 1; min-height: 0; overflow: auto; }
  .pb[hidden] { display: none; }
  #left { grid-row: 1 / 3; } #right { grid-row: 1 / 3; grid-column: 3; }

  /* projects */
  .proj { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: center; padding: 4px 8px; border-bottom: 1px solid #ffffff08; cursor: default; }
  .proj:hover { background: #343437; } .proj.sel { background: var(--sel); }
  .proj img { width: 30px; height: 30px; object-fit: cover; background: var(--field); border: 1px solid var(--line); }
  .proj .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj .s { font-size: 11px; color: var(--quiet); display: flex; gap: 5px; align-items: center; }
  .st { width: 7px; height: 7px; border-radius: 1px; background: var(--quiet); flex: none; display: inline-block; }
  .st.done { background: var(--ok); } .st.running, .st.starting { background: var(--warn); } .st.error { background: var(--bad); }
  .dropnote { padding: 8px; color: var(--quiet); font-size: 11px; border-top: 1px solid var(--line); flex: none; }

  /* viewport */
  #view { grid-column: 2; }
  .vp { position: relative; flex: 1; min-height: 0; overflow: hidden;
        background-color: #39393c; background-image: linear-gradient(#ffffff0a 1px, transparent 1px), linear-gradient(90deg, #ffffff0a 1px, transparent 1px); background-size: 32px 32px; }
  .vp[hidden] { display: none; }
  .vp canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .vp .ov { position: absolute; left: 8px; top: 6px; color: var(--ink2); font-size: 11px; font-family: Consolas, ui-monospace, monospace; pointer-events: none; text-shadow: 0 1px 0 #0008; }
  .vbar { display: flex; align-items: center; gap: 3px; padding: 2px 6px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; min-height: 28px; flex-wrap: wrap; }
  .vbar .lb { color: var(--quiet); margin: 0 4px 0 6px; }
  .tg { height: 22px; padding: 0 8px; border: 1px solid var(--line2); background: var(--panel2); border-radius: 2px; cursor: pointer; color: var(--ink2); }
  .tg:hover { color: var(--ink); border-color: #55555a; } .tg.on { background: var(--sel); border-color: var(--accent); color: var(--ink); }
  .vbar select { height: 22px; background: var(--field); border: 1px solid var(--line2); border-radius: 2px; }

  /* layers (exploded) */
  .space { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.2,.8,.2,1); }
  .space img { position: absolute; transition: transform .8s cubic-bezier(.2,.8,.2,1), opacity .25s, filter .25s; }
  .space img.dim { opacity: .1; } .space img.hl { filter: drop-shadow(0 0 1.5px #6aa6ff) drop-shadow(0 0 1.5px #6aa6ff); }
  .space .plate { position: absolute; border: 1px solid #ffffff30; transition: transform .8s cubic-bezier(.2,.8,.2,1), opacity .5s; }
  .vp.layers { perspective: 2200px; background: #3f3f43; background-image: none; }
  .vbar input[type=range] { width: 160px; accent-color: var(--accent); }

  /* parts grid / sources */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; padding: 8px; align-content: start; }
  .cell { background: var(--panel2); border: 1px solid var(--line); }
  .cell .im { aspect-ratio: 1; display: grid; place-items: center; padding: 5px; background: repeating-conic-gradient(#3b3b3e 0% 25%, #343437 0% 50%) 50% / 10px 10px; }
  .cell .im img { max-width: 100%; max-height: 100%; }
  .cell .nm { padding: 3px 6px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .k { padding: 0 6px 4px; font-size: 10.5px; color: var(--quiet); font-family: Consolas, ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ghead { grid-column: 1 / -1; color: var(--ink2); padding: 6px 2px 2px; border-bottom: 1px solid var(--line2); display: flex; justify-content: space-between; }
  .srcs { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; padding: 8px; align-content: start; }
  .srcs .cell .im { aspect-ratio: 3 / 4; background: #3a3a3d; }
  .srcs .cell .im a { display: grid; place-items: center; width: 100%; height: 100%; }

  /* properties */
  .props { padding: 0 0 10px; }
  .sec { display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; background: #303033; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--ink2); font-weight: 600; margin-top: 6px; }
  .sec:first-child { margin-top: 0; border-top: 0; }
  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 8px; padding: 6px 10px; align-items: center; }
  .kv .k { color: var(--quiet); text-align: right; white-space: nowrap; }
  .kv .v { background: var(--field); border: 1px solid var(--line); padding: 1px 6px; min-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .kv input[type=text] { background: var(--field); border: 1px solid var(--line2); padding: 1px 6px; height: 22px; width: 100%; border-radius: 0; }
  .kv input[type=text]:focus { outline: none; border-color: var(--accent); }
  .kv label { display: flex; gap: 6px; align-items: center; color: var(--ink2); }
  .kv input[type=checkbox] { accent-color: var(--accent); margin: 0; }
  .note { padding: 0 10px; color: var(--quiet); font-size: 11px; }

  /* queue */
  #queue { grid-column: 2; }
  table { width: 100%; border-collapse: collapse; }
  #queue table { font-size: 13.5px; }
  th { position: sticky; top: 0; background: #303033; color: var(--ink2); font-weight: 600; text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: 12px; }
  td { padding: 0 12px; height: 32px; border-bottom: 1px solid #ffffff0d; white-space: nowrap; }
  td.nm { font-weight: 600; color: #ececee; }
  tr.waiting td { color: var(--quiet); } tr.waiting td.nm { color: var(--ink2); font-weight: 400; }
  tr.running td { background: #3d3626; } tr.running td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
  tr.error td { background: #3b2a2a; } tr.error td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink2); }
  td.time { text-align: right; font-variant-numeric: tabular-nums; font-family: Consolas, ui-monospace, monospace; font-size: 13px; }
  .dev { display: inline-block; font-family: Consolas, ui-monospace, monospace; font-size: 11.5px; padding: 1px 7px; border: 1px solid var(--line2); border-radius: 2px; color: var(--ink2); background: var(--panel2); }
  .dev.gpu { color: #8fd19e; border-color: #3f5f48; } .dev.api { color: #8db8f0; border-color: #3c5272; }
  .pgw { display: flex; align-items: center; gap: 10px; }
  .pg { flex: 1; min-width: 160px; height: 12px; background: var(--field); border: 1px solid var(--line); }
  .pg i { display: block; height: 100%; background: #4b6f9f; transition: width .4s; }
  tr.running .pg i { background: var(--warn); background-image: repeating-linear-gradient(-45deg, #ffffff22 0 6px, transparent 6px 12px); background-size: 17px 17px; animation: stripe .8s linear infinite; }
  @keyframes stripe { to { background-position: 17px 0; } }
  .pct { width: 40px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink2); font-size: 12.5px; }
  .stt { display: inline-flex; gap: 7px; align-items: center; }
  .stt .st { width: 9px; height: 9px; }
  tr.running .stt { color: var(--warn); font-weight: 600; } tr.error .stt { color: var(--bad); font-weight: 600; } tr.done .stt { color: #9fd4ad; }
  #qsum { font-size: 12.5px; color: var(--ink2); }
  #qsum b { color: var(--ink); }

  .status { display: flex; align-items: center; gap: 18px; padding: 0 10px; background: #232325; border-top: 1px solid var(--line); color: var(--quiet); font-size: 11px; white-space: nowrap; overflow: hidden; }
  .status b { color: var(--ink2); font-weight: 400; } .status .sp { flex: 1; } #err { color: var(--bad); }
  .dragcover { position: fixed; inset: 0; background: #4a8fe722; border: 2px solid var(--accent); display: none; place-items: center; font-size: 16px; z-index: 9; pointer-events: none; }
  body.dragging .dragcover { display: grid; }
</style>
</head>
<body>
<div class="menubar">
  <span class="app"><i></i>Aliving2D Studio</span>
  <span class="m">파일</span><span class="m">편집</span><span class="m">보기</span><span class="m">작업</span><span class="m">모델</span><span class="m">창</span><span class="m">도움말</span>
  <span class="r" id="docname"></span>
</div>
<div class="toolbar">
  <button class="tb" id="tNew" title="그림 올리기 (창 어디에나 끌어 놓아도 됩니다)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 11V3M5 6l3-3 3 3M2.5 10.5v3h11v-3"/></svg>새 작업</button>
  <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
  <span class="sep"></span>
  <a class="tb" id="tEditor" target="_blank"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 2h12v12H2zM2 6h12M6 6v8"/></svg>에디터에서 열기</a>
  <a class="tb" id="tPlayer" target="_blank"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5 3l8 5-8 5z"/></svg>플레이어</a>
  <span class="sep"></span>
  <button class="tb" id="tRig" title="리깅만 다시 (옵션을 바꾼 뒤)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5"/></svg>리깅 다시 하기</button>
  <button class="tb" id="tStop"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="4" width="8" height="8"/></svg>중지</button>
</div>

<div class="work">
  <section class="panel" id="left">
    <div class="ph"><span class="t on">프로젝트<span class="n" id="nProj"></span></span></div>
    <div class="pb" id="list"></div>
    <div class="dropnote">그림 파일을 창에 끌어 놓으면 새 작업이 시작됩니다</div>
  </section>

  <section class="panel" id="view">
    <div class="ph" id="vtabs">
      <span class="t on" data-v="model">모델</span><span class="t" data-v="layers">레이어 분리<span class="n" id="nL"></span></span>
      <span class="t" data-v="parts">리깅 파츠<span class="n" id="nP"></span></span><span class="t" data-v="sources">소스 이미지</span>
    </div>
    <div class="vbar" id="vbar"></div>
    <div class="vp" id="vp-model"><canvas id="cv"></canvas><div class="ov" id="ovModel"></div></div>
    <div class="vp layers" id="vp-layers" hidden><div class="space" id="space"></div><div class="ov" id="ovLayers"></div></div>
    <div class="pb" id="vp-parts" hidden></div>
    <div class="pb" id="vp-sources" hidden></div>
  </section>

  <section class="panel" id="right">
    <div class="ph"><span class="t on">속성</span></div>
    <div class="pb props" id="props"></div>
  </section>

  <section class="panel" id="queue">
    <div class="ph"><span class="t on">생성 작업</span><span class="x" id="qsum"></span></div>
    <div class="pb"><table><thead><tr><th style="width:34px">#</th><th style="width:150px">단계</th><th>내용</th><th style="width:96px">장치</th><th style="width:96px">상태</th><th style="width:30%">진행</th><th style="width:90px;text-align:right">시간</th></tr></thead><tbody id="qrows"></tbody></table></div>
  </section>
</div>
<div class="status"><span id="sMsg">준비</span><span>레이어 분리 서버 <b id="sSt">–</b></span><span>이미지 API <b id="sAi">–</b></span><span class="sp"></span><span id="err"></span><span>GPU: 로컬</span></div>
<div class="dragcover">놓으면 새 작업을 시작합니다</div>

<script src="../engine/engine.js?v=3"></script>
<script src="../engine/player.js?v=3"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const getJson = async u => { try { const r = await fetch(u, { cache: 'no-store' }); return r.ok ? await r.json() : null; } catch { return null; } };

  const STEP = {
    prepare: ['그림 다듬기', '배경 제거, 캐릭터 영역', 'CPU'], base: ['상반신 원화', '정면 상반신으로 다시 그림', 'Image API'],
    upscale: ['고해상도화', '애니메이션 업스케일러 ×2', 'GPU'], body: ['몸 레이어 분리', 'see-through (레이어 + 깊이)', 'GPU'],
    headcrop: ['얼굴 영역', '얼굴 정사각형 잘라 키우기', 'GPU'], head: ['얼굴 레이어 분리', 'see-through (고해상도 얼굴)', 'GPU'],
    mouth: ['입 벌린 상태', '같은 얼굴의 다른 입', 'Image API'], smile: ['웃는 눈 상태', '같은 얼굴의 ^ ^ 눈', 'Image API'],
    rig: ['자동 리깅', '변형 격자, 키폼, 물리', 'CPU'],
  };
  const KO = { 'back hair': '뒷머리', 'front hair': '앞머리', face: '얼굴', neck: '목', topwear: '상의', bottomwear: '하의', legwear: '다리', handwear: '팔', footwear: '신발',
    ears: '귀', earwear: '귀 장식', eyebrow: '눈썹', eyelash: '속눈썹', eyewhite: '흰자', irides: '눈동자', nose: '코', mouth: '입', headwear: '머리 장식', neckwear: '넥타이·리본', eyewear: '안경', objects: '소품', head: '머리',
    lash_upper: '윗 속눈썹', lash_lower: '아랫 속눈썹', lash_crease: '쌍꺼풀 선', eyelid: '윗 눈꺼풀', eyelid_low: '아랫 눈꺼풀', pupil: '동공', highlight: '하이라이트', highlight2: '하이라이트 2',
    smileeye: '웃는 눈', mouthmask: '입 마스크', mouth_inner: '입 안', mouth_upper: '윗입술', mouth_lower: '아랫입술', 'fx blush': '홍조', 'fx tears': '눈물' };
  const ko = n => { const s = /_r$/.test(n) ? ' R' : /_l$/.test(n) ? ' L' : ''; const b = n.replace(/@body$/, '').replace(/_[rl]$/, ''); return (KO[b] || b) + s + (n.endsWith('@body') ? ' (끝)' : ''); };
  const GROUPS = [['머리카락', /hair/], ['눈썹', /^eyebrow/], ['눈', /^(eye|irides|pupil|highlight|lash|smileeye|fx (heart|sparkle))/], ['입', /^mouth/], ['얼굴', /^(face|nose|ears|earwear|fx)/], ['몸 · 옷', /./]];
  const dur = s => s == null ? '' : s < 60 ? `${Math.round(s)}s` : `${Math.floor(s / 60)}m ${String(Math.round(s % 60)).padStart(2, '0')}s`;
  const stKo = { done: '완료', running: '진행 중', starting: '시작 중', error: '실패', waiting: '대기' };

  let jobs = [], sel = location.hash.slice(1) || null, view = new URLSearchParams(location.search).get('tab') || 'model';
  let loaded = {}, player = null, which = 'head';
  const job = () => jobs.find(j => j.id === sel);

  async function refresh() {
    const d = await getJson('/api/v2/jobs');
    if (!d) { $('err').textContent = '로컬 서버(npm start)에 연결할 수 없습니다'; return; }
    jobs = d.jobs || [];
    $('sSt').textContent = d.seethrough ? '연결됨' : '꺼짐'; $('sAi').textContent = d.openai && d.openai.ready ? '키 있음' : '키 없음';
    if (!sel || !job()) sel = (jobs.find(j => j.state === 'done') || jobs[0] || {}).id || null;
    drawList(); const j = job(); if (j) drawJob(j);
  }

  function drawList() {
    $('nProj').textContent = jobs.length;
    $('list').replaceChildren(...jobs.map(j => {
      const r = h('div', 'proj' + (j.id === sel ? ' sel' : '')), im = h('img');
      im.src = `../work/${j.id}/${j.input || 'input.png'}`; im.onerror = () => { im.style.visibility = 'hidden'; };
      const t = h('div'); t.append(h('div', 'n', j.name || j.id));
      const s = h('div', 's'); s.append(h('span', 'st ' + j.state), document.createTextNode(stKo[j.state] || j.state)); t.append(s);
      r.append(im, t); r.onclick = () => { sel = j.id; location.hash = j.id; loaded = {}; drawList(); drawJob(j); };
      return r;
    }));
  }

  // ---------- one job ----------
  function drawJob(j) {
    const ready = j.steps?.rig?.status === 'done', running = j.state === 'running' || j.state === 'starting';
    const model = `../bundles/${j.id}/model.json`;
    $('docname').textContent = (j.name || j.id) + '  —  ' + j.id;
    $('tEditor').href = `../editor/?model=${encodeURIComponent(model)}`; $('tPlayer').href = `../player/index.html?model=${model}`;
    $('tEditor').classList.toggle('off', !ready); $('tPlayer').classList.toggle('off', !ready);
    $('tRig').disabled = running || j.steps?.head?.status !== 'done'; $('tStop').disabled = !running;
    $('tRig').onclick = () => rerun(j.id, 'rig');
    $('tStop').onclick = async () => { if (confirm('이 작업을 멈출까요?')) { await fetch(`/api/v2/jobs/${j.id}/stop`, { method: 'POST' }); refresh(); } };
    drawQueue(j);
    const key = j.id + ':' + (j.steps?.rig?.finished || 0) + ':' + j.state;
    if (loaded.key !== key) { loaded = { key }; load(j, ready, key); }
    else drawProps(j);
  }

  async function load(j, ready, key) {
    const v = j.steps?.rig?.finished || 0;
    const [m, L] = await Promise.all([ready ? getJson(`../bundles/${j.id}/model.json?v=${v}`) : null, getJson(`../work/${j.id}/layers/layers.json?v=${v}`)]);
    if (loaded.key !== key) return;
    loaded.m = m; loaded.L = L;
    $('nL').textContent = L ? Object.values(L).reduce((a, x) => a + x.layers.length, 0) : '';
    $('nP').textContent = m ? m.parts.filter(p => !p.maskOnly).length : '';
    drawProps(j); loaded.views = {}; showView();
  }

  function drawQueue(j) {
    const ks = Object.keys(j.steps || {});
    let done = 0, total = 0;
    $('qrows').replaceChildren(...ks.map((k, i) => {
      const s = j.steps[k], [n, what, dev] = STEP[k] || [s.label || k, '', ''];
      const tr = h('tr', s.status);
      const p = s.status === 'done' ? 100 : s.status === 'running' ? (s.percent || 0) : 0;
      const t = s.started ? (s.finished || (s.status === 'running' ? Date.now() / 1000 : s.started)) - s.started : null;
      if (s.finished && s.started) total += s.finished - s.started;
      if (s.status === 'done') done++;
      const st = h('span', 'stt'); st.append(h('span', 'st ' + s.status), document.createTextNode(stKo[s.status] || s.status));
      const pgw = h('div', 'pgw'), pg = h('div', 'pg'); pg.innerHTML = `<i style="width:${p}%"></i>`;
      pgw.append(pg, h('span', 'pct', s.status === 'waiting' ? '' : p + '%'));
      const dv = h('span', 'dev' + (dev === 'GPU' ? ' gpu' : dev === 'Image API' ? ' api' : ''), dev);
      const tds = [h('td', 'num', String(i + 1)), h('td', 'nm', n), h('td', null, what), h('td'), h('td'), h('td'), h('td', 'time', s.status === 'waiting' ? '' : dur(t))];
      tds[3].append(dv); tds[4].append(st); tds[5].append(pgw);
      if (s.error) tds[2].textContent = s.error.slice(0, 120);
      tr.append(...tds); return tr;
    }));
    $('qsum').innerHTML = `<span><b>${done} / ${ks.length}</b> 단계 완료 · 총 작업 시간 <b>${dur(total)}</b></span>`;
    $('sMsg').textContent = j.state === 'running' ? '생성 중…' : j.state === 'done' ? '준비' : j.state === 'error' ? '중단됨' : '';
  }

  function drawProps(j) {
    const P = $('props'), m = loaded.m, L = loaded.L;
    if (P.contains(document.activeElement) && document.activeElement.type === 'text') return;     // typing a name
    P.replaceChildren();
    const sec = t => P.append(h('div', 'sec', t));
    const kv = () => { const g = h('div', 'kv'); P.append(g); return g; };
    const row = (g, k, v) => { g.append(h('span', 'k', k)); const e = h('span', 'v', v); g.append(e); return e; };
    sec('프로젝트');
    let g = kv();
    g.append(h('span', 'k', '이름'));
    const nm = h('input'); nm.type = 'text'; nm.value = j.name || j.id; nm.title = 'Enter로 저장';
    let saving = false;
    const save = async () => {
      const v = nm.value.trim(); if (saving || !v || v === (j.name || j.id)) return;
      saving = true;
      const r = await fetch(`/api/v2/jobs/${j.id}/options`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: v }) }).catch(() => null);
      const d = r && r.ok ? await r.json().catch(() => null) : null;
      saving = false;
      // an older server answers ok but ignores the name: check that it was kept
      if (!d || !d.options || d.options.name !== v) { $('err').textContent = '이름이 저장되지 않았습니다 — npm start 서버를 다시 켜 주세요'; return; }
      $('err').textContent = ''; j.name = v; nm.blur(); refresh();
    };
    nm.onkeydown = e => { if (e.key === 'Enter') save(); if (e.key === 'Escape') { nm.value = j.name || j.id; nm.blur(); } };
    nm.onblur = save;
    g.append(nm);
    row(g, 'ID', j.id);
    row(g, '만든 시각', j.created ? new Date(j.created * 1000).toLocaleString('ko-KR') : '');
    row(g, '상태', stKo[j.state] || j.state);
    sec('결과');
    g = kv();
    const nL = L ? Object.values(L).reduce((a, x) => a + x.layers.length, 0) : null;
    row(g, 'AI 분리 레이어', nL == null ? '–' : `${nL}  (몸 ${L.body?.layers.length ?? 0} · 얼굴 ${L.head?.layers.length ?? 0})`);
    row(g, '리깅 파츠', m ? String(m.parts.filter(p => !p.maskOnly).length) : '–');
    row(g, '파라미터', m ? String(m.params.filter(p => !p.hidden).length) : '–');
    row(g, '키폼', m ? m.parts.reduce((a, p) => a + Object.values(p.keys || {}).reduce((b, k) => b + k.values.length, 0), 0).toLocaleString() : '–');
    row(g, '물리', m ? `${(m.physics || []).length}개` : '–');
    row(g, '표정 / 모션', m ? `${(m.expressions || []).length} / ${(m.motions || []).length}` : '–');
    row(g, '캔버스', m ? `${m.canvas[0]} × ${m.canvas[1]}` : '–');
    sec('리깅 옵션');
    g = kv();
    const opts = j.options || {}, extras = new Set(opts.extras || []);
    const running = j.state === 'running' || j.state === 'starting';
    const opt = (label, on, fn) => { g.append(h('span', 'k', '')); const l = h('label'), c = h('input'); c.type = 'checkbox'; c.checked = on; c.disabled = running; c.onchange = () => fn(c.checked); l.append(c, document.createTextNode(label)); g.append(l); };
    const post = async body => { const r = await fetch(`/api/v2/jobs/${j.id}/options`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).catch(() => null); if (!r || !r.ok) { $('err').textContent = '옵션을 저장하지 못했습니다'; return; } if (j.steps?.head?.status === 'done') rerun(j.id, 'rig'); else refresh(); };
    opt('귀 숨기기', opts.ears === false, v => post({ ears: !v }));
    for (const [k, t] of [['physics', '머리카락 흔들림'], ['body', '몸 움직임'], ['arms', '팔'], ['fx', '효과 (홍조·눈물 등)'], ['presets', '기본 표정 세트']])
      opt(t, extras.has(k), v => { v ? extras.add(k) : extras.delete(k); post({ extras: [...extras] }); });
    P.append(h('div', 'note', '바꾸면 리깅만 다시 합니다 (1~2분)'));
  }

  async function rerun(id, step) {
    const r = await fetch(`/api/v2/jobs/${id}/rerun?from=${step}`, { method: 'POST' }).catch(() => null);
    if (!r || !r.ok) $('err').textContent = '다시 하지 못했습니다';
    setTimeout(refresh, 400);
  }

  // ---------- viewports ----------
  for (const t of document.querySelectorAll('#vtabs .t')) t.onclick = () => { view = t.dataset.v; showView(); };
  function showView() {
    for (const t of document.querySelectorAll('#vtabs .t')) t.classList.toggle('on', t.dataset.v === view);
    for (const v of ['model', 'layers', 'parts', 'sources']) $('vp-' + v).hidden = v !== view;
    loaded.views = loaded.views || {};
    if (view !== 'model' && player) { player.destroy(); player = null; loaded.views.model = false; }
    if (loaded.views[view] || !job()) return;
    loaded.views[view] = true;
    ({ model: vModel, layers: vLayers, parts: vParts, sources: vSources })[view](job());
  }

  async function vModel(j) {
    const bar = $('vbar'); bar.replaceChildren();
    if (player) { player.destroy(); player = null; }
    const m = loaded.m, cv = $('cv'), ov = $('ovModel');
    if (!m) { bar.append(h('span', 'lb', '모델이 아직 없습니다 (리깅이 끝나면 나옵니다)')); ov.textContent = ''; return; }
    const fit = () => { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; };
    fit(); if (!cv._ro) { cv._ro = new ResizeObserver(fit); cv._ro.observe(cv); }
    try {
      player = await CapsuleV2Player.create(cv, `../bundles/${j.id}/model.json?v=${j.steps.rig.finished}`, { reactions: '../../engine/reactions.default.json', zoom: 1.1, cy: m.canvas[1] * 0.5 });
      player.model.background = [0, 0, 0, 0];
    } catch (e) { bar.append(h('span', 'lb', '모델을 불러오지 못했습니다: ' + e)); return; }
    cv.onpointermove = e => { const r = cv.getBoundingClientRect(); player && player.lookAt(((e.clientX - r.left) / r.width - 0.5) * 2.4, -((e.clientY - r.top) / r.height - 0.5) * 2.4); };
    const pj = player.model.json;
    const sel = (label, items, fn) => {
      if (!items.length) return;
      bar.append(h('span', 'lb', label));
      const s = h('select'); s.append(new Option('—', ''));
      for (const [t, v] of items) s.append(new Option(t, v));
      s.onchange = () => { if (s.value) fn(s.value); }; bar.append(s);
    };
    if (player.table) {
      const T = { GREETING: '인사', FOCUS_START: '공부 시작', GAZE_AWAY: '딴짓', AWAY: '자리 비움', RETURN: '돌아옴', LONG_FOCUS: '오래 집중', IDLE: '쉬는 중' };
      sel('반응', Object.keys(player.table.reactions).map(k => [T[k] || k, k]), k => player.react(k, 2));
    }
    sel('표정', [['기본', 'neutral'], ...(pj.expressions || []).filter(e => e.name !== 'neutral').map(e => [e.label || e.name, e.name])], n => player.setExpression(n));
    sel('모션', (pj.motions || []).filter(x => x.group !== 'Idle').map(x => [x.label || x.name, x.name]), n => player.playMotion(n));
    let n = 0, t0 = performance.now();
    ov.textContent = `${pj.canvas[0]}×${pj.canvas[1]}  parts ${pj.parts.length}  params ${pj.params.length}`;
    const tick = now => { if (!player) return; if (++n % 30 === 0) { ov.textContent = `${pj.canvas[0]}×${pj.canvas[1]}  parts ${pj.parts.length}  params ${pj.params.length}  ${Math.round(30000 / (now - t0))} fps`; t0 = now; } requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    player.onReaction = (t, c) => { $('sMsg').textContent = `반응 ${t} → ${c.motion || '-'} / ${c.expression || '-'}`; };
  }

  function vLayers(j) {
    const L = loaded.L, bar = $('vbar'), space = $('space'), vp = $('vp-layers');
    bar.replaceChildren(); space.replaceChildren(); $('ovLayers').textContent = '';
    if (!L) { bar.append(h('span', 'lb', '레이어 분리 결과가 아직 없습니다')); return; }
    if (!L[which]) which = L.head ? 'head' : 'body';
    for (const [k, t] of [['body', '몸'], ['head', '얼굴']]) { if (!L[k]) continue; const b = h('button', 'tg' + (k === which ? ' on' : ''), t); b.onclick = () => { which = k; vLayers(j); }; bar.append(b); }
    bar.append(h('span', 'lb', '펼치기'));
    const sp = h('input'); sp.type = 'range'; sp.min = 0; sp.max = 1; sp.step = 0.01; sp.value = 0.85; bar.append(sp);
    const D = L[which], [CW, CH] = D.size, box = vp.getBoundingClientRect(), n = D.layers.length;
    const S = Math.min(box.width * 0.55, box.height * 0.62) / Math.max(CW, CH);
    $('ovLayers').textContent = `${which === 'head' ? 'head.psd' : 'body.psd'}  ${CW}×${CH}  ${n} layers`;
    const plate = h('div', 'plate'); Object.assign(plate.style, { width: CW * S + 'px', height: CH * S + 'px', left: -CW * S / 2 + 'px', top: -CH * S / 2 + 'px' }); space.append(plate);
    const imgs = D.layers.map(ly => { const im = h('img'); im.src = `../work/${j.id}/layers/${ly.file}`; im.title = `${KO[ly.name] || ly.name} (${ly.name})`; const [x, y, w, hh] = ly.box; Object.assign(im.style, { left: (x - CW / 2) * S + 'px', top: (y - CH / 2) * S + 'px', width: w * S + 'px', height: hh * S + 'px' }); space.append(im); return im; });
    const place = () => {
      const t = Number(sp.value);
      space.style.transform = `rotateX(${58 * t}deg) rotateZ(${-30 * t}deg) scale(${1 - 0.22 * t})`;
      const fitGap = (box.height * 0.5) / Math.max(1, n - 1) / Math.sin(58 * Math.PI / 180) / 0.78, gap = Math.min(Math.max(40, 900 / n), fitGap) * t;
      imgs.forEach((im, i) => { im.style.transform = `translateZ(${(i - (n - 1) / 2) * gap}px)`; });
      plate.style.transform = `translateZ(${(-(n - 1) / 2 - 1) * gap}px)`; plate.style.opacity = t;
    };
    sp.oninput = place; place();
    bar.append(h('span', 'lb', '레이어'));
    D.layers.forEach((ly, i) => { const b = h('button', 'tg on', KO[ly.name] || ly.name); b.onclick = () => { b.classList.toggle('on'); imgs[i].classList.toggle('dim', !b.classList.contains('on')); }; b.onmouseenter = () => imgs[i].classList.add('hl'); b.onmouseleave = () => imgs[i].classList.remove('hl'); bar.append(b); });
  }

  function vParts(j) {
    const box = $('vp-parts'), m = loaded.m; $('vbar').replaceChildren();
    if (!m) { box.replaceChildren(h('div', 'note', '리깅이 끝나면 파츠가 나옵니다')); return; }
    $('vbar').append(h('span', 'lb', '파츠마다 변형 격자 분할 수 · 키폼이 걸린 파라미터'));
    const groups = GROUPS.map(([t]) => [t, []]);
    for (const p of m.parts) if (!p.maskOnly) groups[GROUPS.findIndex(([, re]) => re.test(p.name))][1].push(p);
    const g = h('div', 'grid');
    for (const [t, ps] of groups) {
      if (!ps.length) continue;
      const gh = h('div', 'ghead'); gh.append(h('span', null, t), h('span', null, ps.length + '개')); g.append(gh);
      for (const p of ps) {
        const c = h('div', 'cell'), im = h('div', 'im'), img = h('img'); img.loading = 'lazy'; img.src = `../bundles/${j.id}/${p.texture}`; im.append(img);
        const keys = [...Object.keys(p.keys || {}), ...Object.keys(p.opacity || {})].filter(k => !/^sway/.test(k));
        c.append(im, h('div', 'nm', ko(p.name)), h('div', 'k', `${p.grid.nx}×${p.grid.ny}  ${keys.join(' ') || '-'}`)); g.append(c);
      }
    }
    box.replaceChildren(g);
  }

  function vSources(j) {
    const box = $('vp-sources'); $('vbar').replaceChildren(); $('vbar').append(h('span', 'lb', '파이프라인이 만든 중간 이미지 (누르면 원본 크기)'));
    const list = [['input', '원본'], ['prepared.png', '다듬은 그림', 'prepare'], ['base.png', '상반신 원화', 'base'], ['head.png', '얼굴 영역', 'headcrop'], ['mouth.png', '입 벌린 상태', 'mouth'], ['smile.png', '웃는 눈 상태', 'smile']];
    const g = h('div', 'srcs');
    for (const [f, t, k] of list) {
      if (k && j.steps?.[k]?.status !== 'done') continue;
      const c = h('div', 'cell'), im = h('div', 'im'), img = h('img'); img.src = f === 'input' ? `../work/${j.id}/${j.input || 'input.png'}` : `../work/${j.id}/${f}?v=${j.steps?.[k]?.finished || 0}`;
      const a = h('a'); a.href = img.src; a.target = '_blank'; a.append(img); im.append(a);
      c.append(im, h('div', 'nm', t), h('div', 'k', f === 'input' ? (j.input || 'input.png') : f)); g.append(c);
    }
    box.replaceChildren(g);
  }

  // ---------- new job: toolbar button, or a file dropped anywhere ----------
  async function upload(file) {
    $('sMsg').textContent = '올리는 중…';
    try {
      const r = await fetch('/api/v2/jobs', { method: 'POST', body: file, headers: { 'X-Name': encodeURIComponent(file.name.replace(/\.[^.]+$/, '')) } });
      const d = await r.json(); if (!r.ok) throw new Error(d.error);
      sel = d.id; location.hash = d.id; loaded = {}; refresh();
    } catch (e) { $('err').textContent = '올리지 못했습니다' + (e.message ? ': ' + e.message : ''); }
  }
  $('tNew').onclick = () => $('file').click();
  $('file').onchange = e => e.target.files[0] && upload(e.target.files[0]);
  let dc = 0;
  addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dc++; document.body.classList.add('dragging'); } });
  addEventListener('dragleave', () => { if (--dc <= 0) { dc = 0; document.body.classList.remove('dragging'); } });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); dc = 0; document.body.classList.remove('dragging'); const f = e.dataTransfer.files[0]; if (f && /^image\//.test(f.type)) upload(f); });
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (view === 'layers' && job()) vLayers(job()); }, 150); });

  refresh(); setInterval(refresh, 3000);
})();
</script>
</body>
</html>
