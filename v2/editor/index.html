<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aliving2D Editor</title>
<style>
  :root {
    --frame: #141415; --panel: #2a2a2c; --panel2: #313133; --head: #353537; --field: #1f1f21; --line: #141415; --line2: #3e3e41;
    --ink: #d6d6d8; --ink2: #a3a3a7; --quiet: #77777c; --sel: #34507a; --selb: #4a8fe7; --accent: #4a8fe7;
    --g-angle: #2c4263; --g-eye: #5b3237; --g-brow: #5a4430; --g-mouth: #2e4d35; --g-body: #4d4828; --g-arm: #41375a; --g-other: #3a3a3d;
    --grid: #3ddc6a;
    font: 12px/1.45 "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--frame); color: var(--ink); overflow: hidden; }
  body { display: grid; grid-template-rows: 24px 34px 1fr 22px; height: 100vh; }
  button, input, select, textarea { font: inherit; color: inherit; }
  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #48484c; border: 2px solid var(--panel); border-radius: 5px; } ::-webkit-scrollbar-track { background: var(--panel); }

  .menubar { display: flex; align-items: center; background: #232325; border-bottom: 1px solid var(--line); padding: 0 6px; gap: 2px; white-space: nowrap; overflow: hidden; }
  .menubar .app { display: flex; align-items: center; gap: 6px; font-weight: 600; margin-right: 10px; color: #e8e8ea; }
  .menubar .app i { width: 13px; height: 13px; border-radius: 3px; background: var(--accent); display: inline-block; position: relative; }
  .menubar .app i::after { content: ""; position: absolute; inset: 3.5px; border-radius: 50%; background: #232325; }
  .menubar span.m { padding: 1px 8px; border-radius: 2px; cursor: default; color: var(--ink2); }
  .menubar span.m:hover { background: var(--sel); color: var(--ink); }
  .menubar .doc { margin-left: auto; color: var(--quiet); padding-right: 6px; }

  .toolbar { display: flex; align-items: center; gap: 3px; background: var(--panel); border-bottom: 1px solid var(--line); padding: 0 6px; overflow: hidden; }
  .tb { height: 24px; min-width: 24px; padding: 0 8px; border: 1px solid transparent; border-radius: 2px; background: none; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: var(--ink2); white-space: nowrap; text-decoration: none; }
  .tb:hover { background: #3a3a3d; border-color: var(--line2); color: var(--ink); }
  .tb[aria-pressed=true] { background: var(--sel); border-color: var(--selb); color: var(--ink); }
  .tb svg { width: 14px; height: 14px; }
  .sepv { width: 1px; height: 18px; background: var(--line2); margin: 0 5px; }
  .toolbar label { display: flex; align-items: center; gap: 6px; color: var(--ink2); }
  .toolbar select { height: 22px; border: 1px solid var(--line2); background: var(--field); border-radius: 2px; }
  .lvl { display: inline-flex; border: 1px solid var(--line2); border-radius: 2px; overflow: hidden; }
  .lvl b { padding: 0 7px; font-weight: 400; background: var(--field); border-left: 1px solid var(--line2); color: var(--ink2); }
  .lvl b:first-child { border-left: 0; } .lvl b.on { background: var(--selb); color: #fff; }

  .work { display: grid; grid-template-columns: 240px 290px 1fr 330px; min-height: 0; gap: 2px; padding: 2px; background: var(--line); }
  .col { display: grid; gap: 2px; min-height: 0; }
  .col.left { grid-template-rows: 3fr 2fr; } .col.mid { grid-template-rows: auto 1fr; }
  .panel { background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .ph { display: flex; align-items: stretch; background: var(--head); border-bottom: 1px solid var(--line); height: 24px; flex: none; }
  .ph .tab { display: flex; align-items: center; padding: 0 12px; cursor: pointer; color: var(--ink2); border-right: 1px solid var(--line); }
  .ph .tab.on { background: var(--panel); color: var(--ink); box-shadow: inset 0 2px 0 var(--accent); }
  .ph .x { margin-left: auto; display: flex; align-items: center; color: var(--quiet); padding-right: 8px; }
  .pbody { overflow: auto; flex: 1; min-height: 0; }
  .pbody[hidden] { display: none; }
  .pbar { display: flex; gap: 2px; padding: 3px 4px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
  .pbar span { width: 20px; height: 18px; border: 1px solid var(--line2); border-radius: 2px; background: var(--panel2); display: grid; place-items: center; color: var(--quiet); font-size: 10px; }

  .tree { padding: 2px 0; }
  .row { display: grid; grid-template-columns: 18px 18px 1fr auto; align-items: center; height: 21px; padding-right: 6px; cursor: default; white-space: nowrap; }
  .row:hover { background: #343437; }
  .row.sel { background: var(--sel); }
  .row .eye { width: 18px; height: 18px; display: grid; place-items: center; color: var(--ink2); cursor: pointer; }
  .row .eye.off { color: #55555a; }
  .row .eye svg, .row .ic svg { width: 13px; height: 13px; }
  .row .ic { display: grid; place-items: center; color: #c9a45a; }
  .row .nm { overflow: hidden; text-overflow: ellipsis; }
  .row .num { color: var(--quiet); font-size: 11px; font-variant-numeric: tabular-nums; }
  .row.grp .nm { font-weight: 600; }
  .row .tw { display: inline-block; width: 10px; color: var(--quiet); }
  .row.def .ic { color: #5fcf7e; } .row.def.rot .ic { color: #e07070; }

  .insp { padding: 8px 10px; display: grid; grid-template-columns: 92px 1fr; gap: 4px 8px; align-items: center; }
  .insp .k { color: var(--quiet); text-align: right; }
  .insp .v { background: var(--field); border: 1px solid var(--line); padding: 1px 6px; min-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .insp .v.ro { color: var(--ink2); }
  .insp .sw { display: inline-block; width: 11px; height: 11px; border: 1px solid #777; vertical-align: -2px; margin-right: 5px; }
  .insp h5 { grid-column: 1 / -1; margin: 6px 0 0; font-size: 11px; color: var(--quiet); font-weight: 400; text-align: center; }

  .pgrp { border-bottom: 1px solid var(--line); }
  .pgrp > .gh { display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 6px; font-weight: 600; cursor: pointer; color: #e6e6e8; }
  .pgrp > .gh .tw { width: 10px; color: var(--ink2); }
  .pgrp > .gh .c { margin-left: auto; font-weight: 400; color: var(--ink2); font-size: 11px; }
  .pgrp.closed .prm, .pgrp.closed .twod { display: none; }
  .prm { display: grid; grid-template-columns: 92px 1fr 46px; gap: 6px; align-items: center; padding: 4px 8px 4px 16px; background: var(--panel); border-top: 1px solid #ffffff06; }
  .prm.sel { background: #2f3a4b; }
  .prm .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prm .pv { text-align: right; font-variant-numeric: tabular-nums; background: var(--field); border: 1px solid var(--line); padding: 0 4px; }
  .prm.flash { animation: flash 1.2s ease; }
  @keyframes flash { 0%, 40% { background: #4a6d3a; } }
  .track { position: relative; height: 18px; }
  .track input { position: absolute; inset: 0; width: 100%; margin: 0; height: 18px; }
  .track input::-webkit-slider-runnable-track { height: 4px; background: #4a4a4e; border-radius: 2px; margin-top: 7px; }
  .track input::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #e8e8ea; border: 2px solid var(--selb); margin-top: -4px; position: relative; z-index: 2; }
  .track input::-moz-range-track { height: 4px; background: #4a4a4e; border-radius: 2px; }
  .track input::-moz-range-thumb { width: 9px; height: 9px; border-radius: 50%; background: #e8e8ea; border: 2px solid var(--selb); }
  .track i { position: absolute; top: 5px; width: 7px; height: 7px; background: #e05555; transform: translateX(-50%) rotate(45deg); pointer-events: none; z-index: 1; border: 1px solid #2a2a2c; }
  .twod { padding: 6px 16px; background: var(--panel); display: flex; gap: 10px; align-items: center; }
  .pad { position: relative; width: 74px; height: 74px; background: var(--field); border: 1px solid var(--line2); cursor: crosshair; flex: none; }
  .pad::before, .pad::after { content: ""; position: absolute; background: #3a3a3d; }
  .pad::before { left: 50%; top: 0; bottom: 0; width: 1px; } .pad::after { top: 50%; left: 0; right: 0; height: 1px; }
  .pad i { position: absolute; width: 9px; height: 9px; background: #e05555; transform: translate(-50%, -50%) rotate(45deg); border: 1px solid #2a2a2c; }
  .pad .k { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #3ddc6a; transform: translate(-50%, -50%); }
  .twod .lb { color: var(--ink2); font-size: 11px; line-height: 1.6; }

  .chips { display: flex; flex-wrap: wrap; gap: 3px; padding: 6px; }
  .chip { padding: 1px 8px; border: 1px solid var(--line2); background: var(--panel2); border-radius: 2px; cursor: pointer; color: var(--ink2); }
  .chip:hover { border-color: #55555a; color: var(--ink); } .chip.on { background: var(--sel); border-color: var(--selb); color: var(--ink); }
  .save { display: flex; gap: 4px; padding: 6px; border-top: 1px solid var(--line); }
  .save input { flex: 1; min-width: 0; border: 1px solid var(--line2); background: var(--field); padding: 1px 6px; height: 22px; }
  .save button { border: 1px solid var(--line2); background: var(--panel2); padding: 0 10px; border-radius: 2px; cursor: pointer; }
  .note { padding: 0 6px 6px; color: var(--quiet); font-size: 11px; }

  .view { position: relative; background: var(--panel); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .vtabs { display: flex; align-items: stretch; background: var(--head); border-bottom: 1px solid var(--line); height: 24px; flex: none; }
  .vtabs .t { padding: 0 12px; background: var(--panel); display: flex; gap: 8px; align-items: center; box-shadow: inset 0 2px 0 var(--accent); border-right: 1px solid var(--line); }
  .vtabs .t b { width: 7px; height: 7px; background: #e05555; border-radius: 1px; }
  .vtools { display: flex; align-items: center; gap: 2px; padding: 2px 6px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
  .vtools .tb { height: 22px; }
  .canvasbox { position: relative; flex: 1; min-height: 0; overflow: hidden; cursor: grab;
               background-color: #39393c; background-image: linear-gradient(#ffffff0a 1px, transparent 1px), linear-gradient(90deg, #ffffff0a 1px, transparent 1px); background-size: 32px 32px; }
  .canvasbox.drag { cursor: grabbing; }
  .canvasbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ov { pointer-events: none; }
  .vfoot { display: flex; align-items: center; gap: 12px; padding: 2px 8px; border-top: 1px solid var(--line); background: var(--panel); color: var(--ink2); font-size: 11px; flex: none; }
  .vfoot input { width: 120px; accent-color: var(--selb); }

  /* request panel: a customer's words -> changes to the model */
  .ask { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .log { flex: 1; min-height: 0; overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 100%; }
  .msg .who { font-size: 11px; color: var(--quiet); margin-bottom: 2px; }
  .msg .tx { padding: 6px 9px; border: 1px solid var(--line2); background: var(--panel2); border-radius: 2px; white-space: pre-wrap; }
  .msg.me .tx { background: #2c3b52; border-color: #3d5576; }
  .msg.err .tx { background: #3b2a2a; border-color: #5b3434; color: #f0c4c2; }
  .acts { margin-top: 4px; border: 1px solid var(--line2); background: var(--field); }
  .act { display: grid; grid-template-columns: 16px 1fr; gap: 6px; padding: 4px 8px; border-top: 1px solid #ffffff08; align-items: start; }
  .act:first-child { border-top: 0; }
  .act .ck { color: #5fcf7e; } .act.wait .ck { color: var(--warn, #d9a441); } .act.bad .ck { color: #e07070; }
  .act .d { color: var(--ink2); } .act .d b { color: var(--ink); font-weight: 600; }
  .act .d code { font-family: Consolas, ui-monospace, monospace; font-size: 11px; color: #9ab8de; }
  .msg .undo { margin-top: 4px; border: 1px solid var(--line2); background: var(--panel2); border-radius: 2px; padding: 1px 8px; cursor: pointer; color: var(--ink2); }
  .msg .undo:hover { color: var(--ink); border-color: #55555a; }
  .typing { color: var(--quiet); font-style: italic; }
  .sugg { display: flex; flex-wrap: wrap; gap: 3px; padding: 6px 8px; border-top: 1px solid var(--line); }
  .inbox { display: flex; gap: 4px; padding: 6px 8px 8px; border-top: 1px solid var(--line); }
  .inbox textarea { flex: 1; min-height: 52px; max-height: 120px; resize: vertical; background: var(--field); border: 1px solid var(--line2); padding: 5px 7px; border-radius: 0; }
  .inbox textarea:focus { outline: none; border-color: var(--accent); }
  .inbox button { width: 64px; border: 1px solid var(--selb); background: var(--selb); color: #fff; border-radius: 2px; cursor: pointer; font-weight: 600; }
  .inbox button:disabled { opacity: .5; cursor: default; }
  .auto { display: flex; align-items: center; gap: 6px; padding: 0 8px 6px; color: var(--quiet); font-size: 11px; }
  .auto input { accent-color: var(--accent); margin: 0; }

  .status { display: flex; align-items: center; gap: 16px; padding: 0 10px; background: #232325; border-top: 1px solid var(--line); color: var(--quiet); font-size: 11px; white-space: nowrap; overflow: hidden; }
  .status .sp { flex: 1; }
  .status b { font-weight: 400; color: var(--ink2); }
  #err { color: #e07070; }
  @media (max-width: 1400px) { .work { grid-template-columns: 210px 260px 1fr 290px; } }
</style>
</head>
<body>
<div class="menubar">
  <span class="app"><i></i>Aliving2D Editor 2.0</span>
  <span class="m">파일</span><span class="m">편집</span><span class="m">보기</span><span class="m">모델링</span><span class="m">애니메이션</span><span class="m">물리 연산</span><span class="m">창</span><span class="m">도움말</span>
  <span class="doc" id="doc">[ PRO ] · 불러오는 중…</span>
</div>
<div class="toolbar">
  <label>SDK 출력 <select><option>Aliving2D 2.0 / CAPSULE</option><option>Live2D 호환 (motion3 · exp3)</option></select></label>
  <span class="sepv"></span>
  <select id="mode"><option>모델링</option><option>애니메이션</option></select>
  <span class="sepv"></span>
  <span>편집 레벨</span><span class="lvl"><b>1</b><b class="on">2</b><b>3</b></span>
  <span class="sepv"></span>
  <button class="tb" id="tGrid" aria-pressed="true" title="선택한 디포머의 변형 격자"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M2 2h12v12H2zM2 6h12M2 10h12M6 2v12M10 2v12"/></svg>디포머 표시</button>
  <button class="tb" id="tPhys" aria-pressed="true" title="물리 연산 미리보기"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M8 2v6M8 8c-3 2-3 5 0 6M8 8c3 2 3 5 0 6"/><circle cx="8" cy="2" r="1.3"/></svg>물리</button>
  <button class="tb" id="tBlink" aria-pressed="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M1.5 8s2.5-4 6.5-4 6.5 4 6.5 4-2.5 4-6.5 4-6.5-4-6.5-4z"/><circle cx="8" cy="8" r="2"/></svg>자동 깜빡임</button>
  <button class="tb" id="tBreath" aria-pressed="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M2 10c2-4 4-4 6 0s4 4 6 0"/></svg>호흡</button>
  <button class="tb" id="tFollow" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M3 3l4 10 1.5-4 4-1.5z"/></svg>시선 추적</button>
  <button class="tb" id="tSwing" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M3 8a5 5 0 0 1 10 0M13 8l-2-1.5M13 8l1-2"/></svg>각도 미리보기</button>
</div>

<div class="work">
  <div class="col left">
    <div class="panel">
      <div class="ph"><span class="tab on">파츠</span><span class="tab">프로젝트</span><span class="x">▾</span></div>
      <div class="pbar"><span>👁</span><span>🔒</span><span>▤</span><span>⇅</span></div>
      <div class="pbody tree" id="parts"></div>
    </div>
    <div class="panel">
      <div class="ph"><span class="tab on">디포머</span><span class="tab">로그</span><span class="x">▾</span></div>
      <div class="pbody tree" id="defs"></div>
    </div>
  </div>
  <div class="col mid">
    <div class="panel">
      <div class="ph"><span class="tab on">인스펙터</span><span class="tab">툴 상세</span></div>
      <div class="insp" id="insp"></div>
    </div>
    <div class="panel">
      <div class="ph"><span class="tab on" data-p="params">파라미터</span><span class="tab" data-p="expr">표정 · 모션</span></div>
      <div class="pbody" id="params"></div>
      <div class="pbody" id="expr" hidden></div>
    </div>
  </div>
  <div class="view" style="grid-column:3">
    <div class="vtabs"><span class="t"><b></b><span id="vname">model</span></span></div>
    <div class="vtools">
      <button class="tb" id="vFit">화면 맞춤</button><button class="tb" id="vFace">얼굴 확대</button>
      <span class="sepv"></span><span class="muted" id="vsel" style="color:var(--ink2)">디포머를 선택하면 변형 격자가 표시됩니다</span>
    </div>
    <div class="canvasbox" id="box"><canvas id="c"></canvas><canvas id="ov"></canvas></div>
    <div class="vfoot"><span>확대</span><input type="range" id="zoom" min="0.5" max="4" step="0.01" value="1"><span id="zv">100.0%</span><span class="sp" style="flex:1"></span><span id="cur">x –, y –</span></div>
  </div>
  <div class="panel">
    <div class="ph"><span class="tab on">요청</span><span class="x">AI 수정</span></div>
    <div class="ask">
      <div class="log" id="log"><div class="msg"><div class="who">Aliving2D</div><div class="tx">원하는 수정을 말로 적어 주세요. 표정 만들기, 움직임 크기 조절, 머리카락 흔들림 같은 기능 켜기를 이 모델에 바로 적용합니다.</div></div></div>
      <div class="sugg" id="sugg"></div>
      <div class="inbox"><textarea id="askIn" placeholder="예: 수줍게 살짝 웃는 표정을 만들어 주세요"></textarea><button id="askGo">보내기</button></div>
      <label class="auto"><input type="checkbox" id="askAuto" checked>받은 수정을 바로 적용 (끄면 확인 후 적용)</label>
    </div>
  </div>
</div>
<div class="status"><span>준비</span><span>파츠 <b id="sParts">–</b></span><span>디포머 <b id="sDefs">–</b></span><span>키폼 <b id="sKeys">–</b></span><span>파라미터 <b id="sPar">–</b></span><span>물리 <b id="sPhy">–</b></span><span class="sp"></span><span id="err"></span><span id="fps">– fps</span><span>GPU: 로컬 WebGL2</span></div>

<script src="../engine/engine.js?v=3"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const SVG = {
    eye: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 8s2.5-4 6.5-4 6.5 4 6.5 4-2.5 4-6.5 4-6.5-4-6.5-4z"/><circle cx="8" cy="8" r="1.8" fill="currentColor"/></svg>',
    folder: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M1 3.5h5l1.5 1.5H15v8H1z" opacity=".85"/></svg>',
    art: '<svg viewBox="0 0 16 16" fill="none" stroke="#6b7a8c" stroke-width="1.2"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M2 11l3.5-3.5L9 11l2-2 3 3"/></svg>',
    warp: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 3c4-1 8 1 12 0M2 8c4-1 8 1 12 0M2 13c4-1 8 1 12 0M3 2v12M8 2c-1 4 1 8 0 12M13 2v12"/></svg>',
    rot: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="5.5"/><path d="M8 8l4-3"/></svg>',
  };
  const q = new URLSearchParams(location.search);
  const url = q.get('model') || '../bundles/chaerin/model.json';
  const name = (url.match(/bundles\/([^/]+)\//) || [, 'model'])[1];
  $('doc').textContent = `[ PRO ]  -  ${name}.amodel`; $('vname').textContent = name + '.amodel';
  const canvas = $('c'), ov = $('ov'), box = $('box');

      const body = {}; if (a.extras) body.extras = a.extras; if (a.ears != null) body.ears = a.ears;
      await post(`/api/v2/jobs/${jobId}/options`, body);
      const r = await fetch(`/api/v2/jobs/${jobId}/rerun?from=rig`, { method: 'POST' }); if (!r.ok) throw new Error('리깅을 다시 시작하지 못했습니다');
      waitRig(jobId);
    }
  }
  // the rig runs again in the background; when it is done the editor reloads the model (the conversation is kept)
  function waitRig(jobId) {
    const note = say('Aliving2D', '리깅을 다시 하는 중입니다 (1~2분)…'); note.querySelector('.tx').classList.add('typing');
    const t = setInterval(async () => {
      const d = await fetch('/api/v2/jobs', { cache: 'no-store' }).then(r => r.json()).catch(() => null);
      const j = d && (d.jobs || []).find(x => x.id === jobId); if (!j) return;
      if (j.state === 'done') { clearInterval(t); try { sessionStorage.setItem('ask:' + url, log.innerHTML); } catch {} location.reload(); }
      if (j.state === 'error') { clearInterval(t); note.querySelector('.tx').textContent = '리깅이 실패했습니다: ' + ((j.steps.rig || {}).error || ''); note.classList.add('err'); }
    }, 2500);
  }
  try { const old = sessionStorage.getItem('ask:' + url); if (old) { log.innerHTML = old; sessionStorage.removeItem('ask:' + url); say('Aliving2D', '리깅을 다시 해서 새 모델을 불러왔습니다.'); for (const b of log.querySelectorAll('button')) b.remove(); } } catch {}

  async function ask(text) {
    text = text.trim(); if (!text) return;
    say('요청', text, 'me'); askIn.value = ''; askGo.disabled = true;
    const wait = say('Aliving2D', '수정 방법을 정하는 중…'); wait.querySelector('.tx').classList.add('typing');
    let res;
    try { res = await post('/api/v2/edit/plan', { model: url, request: text, history }); }
    catch (e) { wait.remove(); say('Aliving2D', '요청을 처리하지 못했습니다: ' + e.message + (String(e.message).includes('404') || String(e.message) === '501' ? ' (npm start 서버를 다시 켜 주세요)' : ''), 'err'); askGo.disabled = false; return; }
    wait.remove();
    history.push({ role: 'user', content: text }, { role: 'assistant', content: res.reply || '' });
    const msg = say('Aliving2D', res.reply || (res.actions.length ? '수정했습니다.' : '할 수 있는 수정이 없습니다.'));
    if (res.actions.length) {
      const box = h('div', 'acts'), rows = res.actions.map(a => { const r = h('div', 'act wait'); const ck = h('span', 'ck', '•'), d = h('span', 'd'); d.innerHTML = describeAct(a); r.append(ck, d); box.append(r); return r; });
      msg.append(box);
      const apply = async () => {
        let scaled = [];
        for (const [i, a] of res.actions.entries()) {
          try { await runAct(a, res.job); rows[i].className = 'act'; rows[i].firstChild.textContent = '✓'; if (a.type === 'scale_param') scaled.push(a); }
          catch (e) { rows[i].className = 'act bad'; rows[i].firstChild.textContent = '!'; rows[i].lastChild.append(' — ' + e.message); }
        }
        if (scaled.length) {
          const u = h('button', 'undo', '되돌리기');
          u.onclick = async () => { for (const a of scaled.reverse()) { await post('/api/v2/edit/undo', { model: url }).catch(() => {}); scaleLocal(a.param, 1 / a.factor); } u.textContent = '되돌림'; u.disabled = true; };
          msg.append(u);
        }
      };
      if ($('askAuto').checked) await apply();
      else { const b = h('button', 'undo', '적용'); b.onclick = async () => { b.remove(); await apply(); }; msg.append(b); }
    }
    askGo.disabled = false; log.scrollTop = log.scrollHeight;
  }
  askGo.onclick = () => ask(askIn.value);
  if (q.get('ask')) setTimeout(() => ask(q.get('ask')), 300);          // for checks and demos: ?ask=<request>
  askIn.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(askIn.value); } };
  for (const t of ['수줍게 살짝 웃는 표정 만들어줘', '화난 표정 만들어줘', '고개가 더 많이 돌아가게 해줘', '눈을 더 동그랗게 떠 줘', '머리카락이 흔들리게 해줘', '귀를 숨겨줘']) {
    const c = h('button', 'chip', t); c.onclick = () => ask(t); $('sugg').append(c);
  }

  // ---------- view: zoom / pan ----------
  let zoom = Number(q.get('zoom') || 1), cx = W / 2, cy = H / 2;
  const setZoom = z => { zoom = Math.max(0.5, Math.min(4, z)); $('zoom').value = zoom; };
  $('zoom').oninput = e => setZoom(Number(e.target.value));
  $('vFit').onclick = () => { setZoom(1); cx = W / 2; cy = H / 2; };
  $('vFace').onclick = () => {
    const f = m.parts.find(p => p.name === 'face');
    if (f) { const [x, y, w, hh] = f.spec.rect; cx = x + w / 2; cy = y + hh / 2; setZoom(Math.min(4, 0.75 * Math.min(W / w, H / hh))); }
  };
  box.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)); }, { passive: false });
  let drag = null;
  box.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY, cx, cy }; box.classList.add('drag'); box.setPointerCapture(e.pointerId); };
  box.onpointerup = () => { drag = null; box.classList.remove('drag'); };
  const toModel = (sx, sy) => { const r = box.getBoundingClientRect(), fitS = Math.min(r.width / W, r.height / H) * zoom; return [cx + (sx - r.width / 2) / fitS, cy + (sy - r.height / 2) / fitS]; };
  let look = { x: 0, y: 0 };
  box.onpointermove = e => {
    const r = box.getBoundingClientRect();
    if (drag) { const s = Math.min(r.width / W, r.height / H) * zoom; cx = drag.cx - (e.clientX - drag.x) / s; cy = drag.cy - (e.clientY - drag.y) / s; }
    const [mx, my] = toModel(e.clientX - r.left, e.clientY - r.top);
    $('cur').textContent = `x ${mx.toFixed(1)}, y ${my.toFixed(1)}`;
    look = { x: Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - 0.5) * 2.4)), y: Math.max(-1, Math.min(1, -((e.clientY - r.top) / r.height - 0.5) * 2.4)) };
  };
  new ResizeObserver(fit).observe(box);
  for (const id of ['tGrid', 'tPhys', 'tBlink', 'tBreath', 'tFollow', 'tSwing']) $(id).onclick = () => $(id).setAttribute('aria-pressed', String($(id).getAttribute('aria-pressed') !== 'true'));
  const on = id => $(id).getAttribute('aria-pressed') === 'true';

  // ---------- overlay: the selected deformer's grid ----------
  const g2 = ov.getContext('2d');
  const drawOverlay = () => {
    const d = devicePixelRatio || 1;
    g2.setTransform(d, 0, 0, d, 0, 0);
    g2.clearRect(0, 0, ov.width, ov.height);
    if (selIdx < 0 || !on('tGrid')) return;
    const p = m.parts[selIdx], P = m.controlPoints(p), N = p.nx + 1;
    const S = i => m.toScreen(P[i * 2], P[i * 2 + 1]);
    g2.lineWidth = 1; g2.strokeStyle = '#1fa83ccc';
    for (let j = 0; j <= p.ny; j++) { g2.beginPath(); for (let i = 0; i <= p.nx; i++) { const [x, y] = S(j * N + i); i ? g2.lineTo(x, y) : g2.moveTo(x, y); } g2.stroke(); }
    for (let i = 0; i <= p.nx; i++) { g2.beginPath(); for (let j = 0; j <= p.ny; j++) { const [x, y] = S(j * N + i); j ? g2.lineTo(x, y) : g2.moveTo(x, y); } g2.stroke(); }
    g2.fillStyle = '#1fa83c'; g2.strokeStyle = '#fff';
    for (let k = 0; k < N * (p.ny + 1); k++) { const [x, y] = S(k); g2.fillRect(x - 2.5, y - 2.5, 5, 5); g2.strokeRect(x - 2.5, y - 2.5, 5, 5); }
    // the part's own box, dashed
    const [rx, ry, rw, rh] = p.spec.rect, a = m.toScreen(rx, ry), b = m.toScreen(rx + rw, ry + rh);
    g2.setLineDash([4, 3]); g2.strokeStyle = '#2f6fcf'; g2.strokeRect(a[0], a[1], b[0] - a[0], b[1] - a[1]); g2.setLineDash([]);
  };

  // ---------- loop ----------
  $('sParts').textContent = m.parts.filter(p => !p.maskOnly).length; $('sDefs').textContent = nDefs; $('sKeys').textContent = nKeys.toLocaleString();
  $('sPar').textContent = visible.length; $('sPhy').textContent = (J.physics || []).length;
  showInsp();
  const t0 = performance.now();
  let last = t0, nextBlink = t0 + 2000, blink = -1, frames = 0, fpsT = t0;
  const ease = t => t * t * (3 - 2 * t);
  const frame = now => {
    const idle = now - held > 1500;
    if (on('tSwing')) { look = { x: Math.sin((now - t0) / 1000 * 0.9), y: 0.35 * Math.sin((now - t0) / 1000 * 0.55) }; }
    if ((on('tFollow') || on('tSwing')) && idle) {
      for (const [id, g, k] of [['angleX', look.x, 0.1], ['angleY', look.y, 0.1], ['eyeX', look.x, 0.3], ['eyeY', look.y, 0.3], ['bodyX', 0.35 * (m.params.angleX ?? 0), 0.04]])
        if (id in m.params) m.set(id, m.params[id] + (g - m.params[id]) * k);
    }
    if (on('tBreath') && 'breath' in m.params) m.set('breath', 0.5 - 0.5 * Math.cos((now - t0) / 1000 * 2 * Math.PI / 3.6));
    const et = exprT0 < 0 ? 1 : Math.min(1, (now - exprT0) / 300), ez = ease(et), base = {};
    for (const id of exprIds) {
      if (!(id in m.params) || (manual[id] && manual[id] > exprT0)) continue;
      const goal = expr[id] ?? defaults[id], from = exprFrom[id] ?? goal, v = from + (goal - from) * ez;
      if (id.startsWith('eyeOpen')) { base[id] = v; continue; }
      if (et < 1 || id in expr) m.set(id, v);
    }
    if (on('tBlink') && 'eyeOpenL' in m.params) {
      if (blink < 0 && now > nextBlink) blink = now;
      let o = 1;
      if (blink >= 0) { const u = (now - blink) / 320; o = u < 0.35 ? 1 - ease(u / 0.35) : u < 0.47 ? 0 : u < 1 ? ease((u - 0.47) / 0.53) : 1; if (u >= 1) { blink = -1; nextBlink = now + 2500 + Math.random() * 3000; } }
      for (const id of ['eyeOpenL', 'eyeOpenR']) if (id in m.params) m.set(id, (base[id] ?? expr[id] ?? 1) * o);
    }
    if (motion) {
      const el = (now - motion.t0) / 1000, mo = motion.mo, w = Math.min(1, el / 0.3) * (el > mo.duration ? Math.max(0, 1 - (el - mo.duration) / 0.3) : 1);
      for (const [id, k] of Object.entries(mo.curves)) if (id in m.params) m.set(id, motion.base[id] * (1 - w) + curveAt(k, Math.min(el, mo.duration)) * w);
      if (w <= 0 && el > mo.duration) motion = null;
    }
    if (on('tPhys')) m.step(Math.min(0.05, (now - last) / 1000));
    last = now;
    m.setView(zoom, cx, cy);
    m.draw();
    drawOverlay();
    for (const id in inputs) { if (document.activeElement !== inputs[id]) inputs[id].value = m.params[id]; vals[id].textContent = (/^angle/.test(id) ? m.params[id] * 30 : m.params[id]).toFixed(/^angle/.test(id) ? 1 : 2); }
    pads.forEach(f => f());
    $('zv').textContent = (zoom * 100).toFixed(1) + '%';
    if (++frames % 30 === 0) { $('fps').textContent = Math.round(30000 / (now - fpsT)) + ' fps'; fpsT = now; }
    if (selIdx >= 0 && frames % 10 === 0) { const o = insp.querySelectorAll('.v')[3]; if (o) o.textContent = Math.round((m.parts[selIdx].alpha ?? 1) * 100) + ' %'; }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  if (q.get('select')) { const i = m.parts.findIndex(p => p.name === q.get('select')); if (i >= 0) select(i); }
  if (q.get('face')) $('vFace').onclick();
})();
</script>
</body>
</html>
